name: Validate Astro source
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Verify VE-01 attack-chain diagram
        run: |
          test -s dist/diagrams/ve-01-attack-chain.svg
          test -s dist/diagrams/ve-01-attack-chain-mobile.svg
          grep -q 've-01-attack-chain.svg' dist/machines/ve-01/index.html
      - name: Verify VE-01 user attack-chain diagram
        run: |
          test -s dist/diagrams/ve-01-user-attack-chain.svg
          test -s dist/diagrams/ve-01-user-attack-chain-mobile.svg
          grep -q 've-01-user-attack-chain.svg' dist/machines/ve-01/user/index.html
      - name: Verify VE-01 root privilege-escalation diagram
        run: |
          test -s dist/diagrams/ve-01-root-attack-chain.svg
          test -s dist/diagrams/ve-01-root-attack-chain-mobile.svg
          grep -q 've-01-root-attack-chain.svg' dist/machines/ve-01/root/index.html
          grep -q 'Effective UID = 0' dist/diagrams/ve-01-root-attack-chain.svg
          grep -q 'Read /root/root.txt' dist/diagrams/ve-01-root-attack-chain-mobile.svg
      - name: Verify EA-01 overview attack-chain diagram
        run: |
          test -s dist/diagrams/ea-01-attack-chain.svg
          test -s dist/diagrams/ea-01-attack-chain-mobile.svg
          grep -q 'ea-01-attack-chain.svg' dist/machines/ea-01/index.html
          grep -q 'Enumerate sqlite_master' dist/diagrams/ea-01-attack-chain.svg
          grep -q 'Discover SUID' dist/diagrams/ea-01-attack-chain-mobile.svg
          grep -q 'Read /root/root.txt' dist/diagrams/ea-01-attack-chain.svg
      - name: Verify EA-01 user attack-chain diagram
        run: |
          test -s dist/diagrams/ea-01-user-attack-chain.svg
          test -s dist/diagrams/ea-01-user-attack-chain-mobile.svg
          grep -q 'ea-01-user-attack-chain.svg' dist/machines/ea-01/user/index.html
          grep -q 'MySQL Enumeration Fails' dist/diagrams/ea-01-user-attack-chain.svg
          grep -q 'Query sqlite_master' dist/diagrams/ea-01-user-attack-chain.svg
          grep -q 'Submit User Flag' dist/diagrams/ea-01-user-attack-chain-mobile.svg
      - name: Verify EA-01 root privilege-escalation diagram
        run: |
          test -s dist/diagrams/ea-01-root-attack-chain.svg
          test -s dist/diagrams/ea-01-root-attack-chain-mobile.svg
          grep -q 'ea-01-root-attack-chain.svg' dist/machines/ea-01/root/index.html
          grep -q 'sudo Not Installed' dist/diagrams/ea-01-root-attack-chain.svg
          grep -q 'Root-Owned SUID Permission' dist/diagrams/ea-01-root-attack-chain.svg
          grep -q 'Read /root/root.txt' dist/diagrams/ea-01-root-attack-chain.svg
          grep -q 'Raw session response not saved' dist/diagrams/ea-01-root-attack-chain-mobile.svg
          grep -q 'EA-01 Completed' dist/diagrams/ea-01-root-attack-chain-mobile.svg
      - name: Verify ME-01 overview attack-chain diagram
        run: |
          test -s dist/diagrams/me-01-attack-chain.svg
          test -s dist/diagrams/me-01-attack-chain-mobile.svg
          grep -q 'me-01-attack-chain.svg' dist/machines/me-01/index.html
          grep -q 'Discover pyadmin cap_setuid=ep' dist/diagrams/me-01-attack-chain.svg
          grep -q 'Python os.setuid(0)' dist/diagrams/me-01-attack-chain.svg
          grep -q 'UID = 0 / EUID = 0' dist/diagrams/me-01-attack-chain.svg
          grep -q 'Read /root/root.txt' dist/diagrams/me-01-attack-chain-mobile.svg
          grep -q 'No host escape' dist/diagrams/me-01-attack-chain-mobile.svg
      - name: Verify ME-01 user attack-chain diagram
        run: |
          test -s dist/diagrams/me-01-user-attack-chain.svg
          test -s dist/diagrams/me-01-user-attack-chain-mobile.svg
          grep -q 'me-01-user-attack-chain.svg' dist/machines/me-01/user/index.html
          grep -q 'Read /proc/self/cmdline' dist/diagrams/me-01-user-attack-chain.svg
          grep -q 'Identify config.API_KEY' dist/diagrams/me-01-user-attack-chain.svg
          grep -q 'Recover API Key' dist/diagrams/me-01-user-attack-chain.svg
          grep -q 'Remote Command Execution as svc' dist/diagrams/me-01-user-attack-chain.svg
          grep -q '/home/svc/user.txt' dist/diagrams/me-01-user-attack-chain-mobile.svg
          test "$(grep -o '<circle cx="' dist/diagrams/me-01-user-attack-chain.svg | wc -l)" -eq 15
          test "$(grep -o '<circle cx="' dist/diagrams/me-01-user-attack-chain-mobile.svg | wc -l)" -eq 15
      - name: Verify ME-01 root privilege-escalation diagram
        run: |
          test -s dist/diagrams/me-01-root-attack-chain.svg
          test -s dist/diagrams/me-01-root-attack-chain-mobile.svg
          grep -q 'me-01-root-attack-chain.svg' dist/machines/me-01/root/index.html
          grep -q '/usr/local/bin/pyadmin cap_setuid=ep' dist/diagrams/me-01-root-attack-chain.svg
          grep -q 'Real UID = 0' dist/diagrams/me-01-root-attack-chain.svg
          grep -q 'Effective UID = 0' dist/diagrams/me-01-root-attack-chain-mobile.svg
          grep -q 'No container escape or host-root proof' dist/diagrams/me-01-root-attack-chain-mobile.svg
          grep -q 'Read /root/root.txt' dist/diagrams/me-01-root-attack-chain.svg
          test "$(grep -o '<circle cx="' dist/diagrams/me-01-root-attack-chain.svg | wc -l)" -eq 10
          test "$(grep -o '<circle cx="' dist/diagrams/me-01-root-attack-chain-mobile.svg | wc -l)" -eq 10
      - name: Verify HA-01 overview summary diagram
        run: |
          test -s dist/diagrams/ha-01-attack-chain.svg
          test -s dist/diagrams/ha-01-attack-chain-mobile.svg
          grep -q 'ha-01-attack-chain.svg' dist/machines/ha-01/index.html
          test "$(grep -o '<circle cx="' dist/diagrams/ha-01-attack-chain.svg | wc -l)" -eq 11
          test "$(grep -o '<circle cx="' dist/diagrams/ha-01-attack-chain-mobile.svg | wc -l)" -eq 11
          grep -Fq 'Unauthenticated Redis' dist/diagrams/ha-01-attack-chain.svg
          grep -Fq 'Redis administrative access' dist/diagrams/ha-01-attack-chain.svg
          grep -Fq 'Find root cron job' dist/diagrams/ha-01-attack-chain.svg
          grep -Fq 'GNU tar wildcard option injection' dist/diagrams/ha-01-attack-chain.svg
      - name: Verify HA-01 initial access diagram
        run: |
          test -s dist/diagrams/ha-01-initial-access-chain.svg
          test -s dist/diagrams/ha-01-initial-access-chain-mobile.svg
          grep -q 'ha-01-initial-access-chain.svg' dist/machines/ha-01/index.html
          test "$(grep -o '<circle cx="' dist/diagrams/ha-01-initial-access-chain.svg | wc -l)" -eq 7
          test "$(grep -o '<circle cx="' dist/diagrams/ha-01-initial-access-chain-mobile.svg | wc -l)" -eq 7
          grep -Fq 'Default ACL: nopass, +@all' dist/diagrams/ha-01-initial-access-chain.svg
          grep -Fq 'Prove Redis can write to the directory' dist/diagrams/ha-01-initial-access-chain.svg
          grep -Fq 'RDB snapshot written as authorized_keys' dist/diagrams/ha-01-initial-access-chain.svg
          grep -Fq 'SSH authentication as devops' dist/diagrams/ha-01-initial-access-chain.svg
      - name: Verify HA-01 privilege escalation diagram
        run: |
          test -s dist/diagrams/ha-01-privilege-escalation-chain.svg
          test -s dist/diagrams/ha-01-privilege-escalation-chain-mobile.svg
          grep -q 'ha-01-privilege-escalation-chain.svg' dist/machines/ha-01/index.html
          test "$(grep -o '<circle cx="' dist/diagrams/ha-01-privilege-escalation-chain.svg | wc -l)" -eq 8
          test "$(grep -o '<circle cx="' dist/diagrams/ha-01-privilege-escalation-chain-mobile.svg | wc -l)" -eq 8
          grep -Fq 'No sudo, no useful SUID, no capabilities' dist/diagrams/ha-01-privilege-escalation-chain.svg
          grep -Fq 'Discover /etc/cron.d/maint' dist/diagrams/ha-01-privilege-escalation-chain.svg
          grep -Fq 'Create tar checkpoint option filenames' dist/diagrams/ha-01-privilege-escalation-chain.svg
          grep -Fq 'Read /root/root.txt' dist/diagrams/ha-01-privilege-escalation-chain.svg
      - name: Verify HA-01 SVG XML structure
        run: |
          python3 -c "import xml.etree.ElementTree as ET; from pathlib import Path; diagrams=list(Path('dist/diagrams').glob('ha-01-*.svg')); assert len(diagrams) == 8, len(diagrams); [ET.parse(p) for p in diagrams]"
      - name: Verify HA-01 root attack-chain diagram
        run: |
          test -s dist/diagrams/ha-01-root-attack-chain.svg
          test -s dist/diagrams/ha-01-root-attack-chain-mobile.svg
          grep -Fq 'ha-01-root-attack-chain.svg' dist/machines/ha-01/root/index.html
          test "$(grep -o '<circle cx="' dist/diagrams/ha-01-root-attack-chain.svg | wc -l)" -eq 13
          test "$(grep -o '<circle cx="' dist/diagrams/ha-01-root-attack-chain-mobile.svg | wc -l)" -eq 13
          grep -Fq 'Discover devops-writable /opt/maint/spool' dist/diagrams/ha-01-root-attack-chain.svg
          grep -Fq 'Create malicious --checkpoint filenames' dist/diagrams/ha-01-root-attack-chain.svg
          grep -Fq 'Root cron executes tar with injected options' dist/diagrams/ha-01-root-attack-chain.svg
          grep -Fq '/opt/maint/spool/root.txt' dist/diagrams/ha-01-root-attack-chain-mobile.svg
          grep -Fq 'No interactive root shell documented' dist/diagrams/ha-01-root-attack-chain-mobile.svg
      - name: Verify IN-01 overview attack-chain diagram
        run: |
          test -s dist/diagrams/in-01-attack-chain.svg
          test -s dist/diagrams/in-01-attack-chain-mobile.svg
          grep -Fq 'in-01-attack-chain.svg' dist/machines/in-01/index.html
          test "$(grep -o '<circle cx="' dist/diagrams/in-01-attack-chain.svg | wc -l)" -eq 21
          test "$(grep -o '<circle cx="' dist/diagrams/in-01-attack-chain-mobile.svg | wc -l)" -eq 21
          grep -Fq 'SSRF — Server-Side Request Forgery' dist/diagrams/in-01-attack-chain.svg
          grep -Fq '127.1:9000' dist/diagrams/in-01-attack-chain.svg
          grep -Fq 'Base64-Encoded Python Pickle' dist/diagrams/in-01-attack-chain.svg
          grep -Fq 'NOPASSWD: /usr/local/bin/healthcheck' dist/diagrams/in-01-attack-chain.svg
          grep -Fq 'env_keep += LD_PRELOAD' dist/diagrams/in-01-attack-chain.svg
          grep -Fq 'UID=0 EUID=0 GID=0 EGID=0' dist/diagrams/in-01-attack-chain-mobile.svg
          grep -Fq 'No interactive root shell was established' dist/diagrams/in-01-attack-chain-mobile.svg
      - name: Verify IN-01 SVG XML structure
        run: |
          python3 -c "import xml.etree.ElementTree as ET; from pathlib import Path; a=list(Path('dist/diagrams').glob('in-01-attack-chain*.svg')); assert len(a)==2, len(a); [ET.parse(p) for p in a]"
      - name: Verify IN-01 User objective flowchart and attack chain
        run: |
          test -s dist/diagrams/in-01-user-objective-flowchart.svg
          test -s dist/diagrams/in-01-user-attack-chain.svg
          test -s dist/diagrams/in-01-user-attack-chain-mobile.svg
          grep -Fq 'in-01-user-objective-flowchart.svg' dist/machines/in-01/user/index.html
          grep -Fq 'in-01-user-attack-chain.svg' dist/machines/in-01/user/index.html
          grep -Fq 'in-01-user-attack-chain-mobile.svg' dist/machines/in-01/user/index.html
          grep -Fq 'attack-chain-figure--compact' dist/machines/in-01/user/index.html
          test "$(grep -o '<circle cx="52"' dist/diagrams/in-01-user-objective-flowchart.svg | wc -l)" -eq 10
          test "$(grep -o '<path d="M220 ' dist/diagrams/in-01-user-objective-flowchart.svg | wc -l)" -eq 9
          test "$(grep -o '<circle cx="' dist/diagrams/in-01-user-attack-chain.svg | wc -l)" -eq 19
          test "$(grep -o '<circle cx="' dist/diagrams/in-01-user-attack-chain-mobile.svg | wc -l)" -eq 19
          grep -Fq 'Internal Admin API — 127.1:9000' dist/diagrams/in-01-user-objective-flowchart.svg
          grep -Fq 'Identify Base64 decoding and Pickle deserialization' dist/diagrams/in-01-user-attack-chain.svg
          grep -Fq 'Callback unsuccessful' dist/diagrams/in-01-user-attack-chain.svg
          grep -Fq 'Cause unverified' dist/diagrams/in-01-user-attack-chain-mobile.svg
          grep -Fq 'max-width: 440px' src/styles/prose.css
      - name: Verify IN-01 User SVG XML structure
        run: |
          python3 -c "import xml.etree.ElementTree as ET; from pathlib import Path; xs=list(Path('dist/diagrams').glob('in-01-user-*.svg')); assert len(xs)==3, len(xs); [ET.parse(p) for p in xs]"
      - name: Verify IN-01 Root objective flowchart and attack chain
        run: |
          test -s dist/diagrams/in-01-root-objective-flowchart.svg
          test -s dist/diagrams/in-01-root-attack-chain.svg
          test -s dist/diagrams/in-01-root-attack-chain-mobile.svg
          grep -Fq 'in-01-root-objective-flowchart.svg' dist/machines/in-01/root/index.html
          grep -Fq 'in-01-root-attack-chain.svg' dist/machines/in-01/root/index.html
          grep -Fq 'in-01-root-attack-chain-mobile.svg' dist/machines/in-01/root/index.html
          grep -Fq 'attack-chain-figure--compact' dist/machines/in-01/root/index.html
          test "$(grep -o '<circle cx="52"' dist/diagrams/in-01-root-objective-flowchart.svg | wc -l)" -eq 11
          test "$(grep -o '<path d="M220 ' dist/diagrams/in-01-root-objective-flowchart.svg | wc -l)" -eq 10
          test "$(grep -o '<circle cx="' dist/diagrams/in-01-root-attack-chain.svg | wc -l)" -eq 13
          test "$(grep -o '<circle cx="' dist/diagrams/in-01-root-attack-chain-mobile.svg | wc -l)" -eq 13
          grep -Fq 'env_keep+=LD_PRELOAD' dist/diagrams/in-01-root-objective-flowchart.svg
          grep -Fq 'Discover NOPASSWD healthcheck' dist/diagrams/in-01-root-attack-chain.svg
          grep -Fq 'sudo -n LD_PRELOAD=/tmp/in01_preload.so' dist/diagrams/in-01-root-attack-chain.svg
          grep -Fq 'UID=0 EUID=0 GID=0 EGID=0' dist/diagrams/in-01-root-attack-chain-mobile.svg
          grep -Fq 'cleanup not verified' dist/diagrams/in-01-root-attack-chain-mobile.svg
          grep -Fq 'max-width: 440px' src/styles/prose.css
      - name: Verify IN-01 Root SVG XML structure
        run: |
          python3 -c "import xml.etree.ElementTree as ET; from pathlib import Path; xs=list(Path('dist/diagrams').glob('in-01-root-*.svg')); assert len(xs)==3, len(xs); [ET.parse(p) for p in xs]"

      - name: Verify Exam Timeline milestone rails and branch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import re
          page = Path('dist/timeline/index.html').read_text()
          expected = {'ve-01':8, 'ea-01':8, 'me-01':9, 'ha-01':9, 'in-01':10}
          for machine, count in expected.items():
              for suffix in ('','-mobile'):
                  name = f'exam-timeline-{machine}{suffix}.svg'
                  svg = Path('dist/diagrams') / name
                  assert svg.exists() and svg.stat().st_size > 500, svg
                  root = ET.parse(svg).getroot()
                  phases = [g for g in root.iter() if re.fullmatch(r'phase-\d{2}', g.attrib.get('id',''))]
                  assert len(phases) == count, (name, len(phases))
                  branches = [g for g in root.iter() if g.attrib.get('id') == 'user-flag-branch']
                  assert len(branches) == int(machine == 'me-01'), name
                  content = ''.join(root.itertext())
                  assert 'NO INVENTED TIMESTAMPS' in content
                  if machine == 'me-01': assert 'user.txt' in content
                  assert name in page
          assert page.count('class="exam-timeline-figure"') == 5
          print('5 timeline figures, 10 XML assets, 5 exact step counts, and ME-01 branch verified')
          PY
