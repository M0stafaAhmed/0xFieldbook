name: Validate Astro source
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Verify VE-01 attack-chain diagram
        run: |
          test -s dist/diagrams/ve-01-attack-chain.svg
          test -s dist/diagrams/ve-01-attack-chain-mobile.svg
          grep -q 've-01-attack-chain.svg' dist/machines/ve-01/index.html
      - name: Verify VE-01 user attack-chain diagram
        run: |
          test -s dist/diagrams/ve-01-user-attack-chain.svg
          test -s dist/diagrams/ve-01-user-attack-chain-mobile.svg
          grep -q 've-01-user-attack-chain.svg' dist/machines/ve-01/user/index.html
      - name: Verify VE-01 root privilege-escalation diagram
        run: |
          test -s dist/diagrams/ve-01-root-attack-chain.svg
          test -s dist/diagrams/ve-01-root-attack-chain-mobile.svg
          grep -q 've-01-root-attack-chain.svg' dist/machines/ve-01/root/index.html
          grep -q 'Effective UID = 0' dist/diagrams/ve-01-root-attack-chain.svg
          grep -q 'Read /root/root.txt' dist/diagrams/ve-01-root-attack-chain-mobile.svg
      - name: Verify EA-01 overview attack-chain diagram
        run: |
          test -s dist/diagrams/ea-01-attack-chain.svg
          test -s dist/diagrams/ea-01-attack-chain-mobile.svg
          grep -q 'ea-01-attack-chain.svg' dist/machines/ea-01/index.html
          grep -q 'Enumerate sqlite_master' dist/diagrams/ea-01-attack-chain.svg
          grep -q 'Discover SUID' dist/diagrams/ea-01-attack-chain-mobile.svg
          grep -q 'Read /root/root.txt' dist/diagrams/ea-01-attack-chain.svg
      - name: Verify EA-01 user attack-chain diagram
        run: |
          test -s dist/diagrams/ea-01-user-attack-chain.svg
          test -s dist/diagrams/ea-01-user-attack-chain-mobile.svg
          grep -q 'ea-01-user-attack-chain.svg' dist/machines/ea-01/user/index.html
          grep -q 'MySQL Enumeration Fails' dist/diagrams/ea-01-user-attack-chain.svg
          grep -q 'Query sqlite_master' dist/diagrams/ea-01-user-attack-chain.svg
          grep -q 'Submit User Flag' dist/diagrams/ea-01-user-attack-chain-mobile.svg
