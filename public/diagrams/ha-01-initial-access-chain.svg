<g><rect x="122" y="1111" width="608" height="136" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="122" y="1127" width="4" height="104" rx="2" fill="#4fae6c"/><circle cx="79" cy="1179" r="20" fill="#1c1f26" stroke="#4fae6c" stroke-width="2"/><text x="79" y="1184.5" text-anchor="middle" fill="#e8e9ec" font-size="16" font-weight="700">07</text><text x="148" y="1137" fill="#4fae6c" font-size="11.6" font-weight="700" letter-spacing="1">USER ACCESS</text><text x="148" y="1174" font-size="20" font-weight="650" fill="#e8e9ec">SSH authentication as devops</text><text x="148" y="1214" font-size="15" fill="#aeb5c1">Private key stays on Kali; login confirmed as devops</text></g><text x="39" y="1293" fill="#8b93a1" font-size="14">Public key deployed via Redis RDB; matching private key remained on Kali</text></g>
