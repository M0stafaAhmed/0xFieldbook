<g><rect x="122" y="331" width="608" height="136" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="122" y="347" width="4" height="104" rx="2" fill="#4fb3bf"/><circle cx="79" cy="399" r="20" fill="#1c1f26" stroke="#4fb3bf" stroke-width="2"/><text x="79" y="404.5" text-anchor="middle" fill="#e8e9ec" font-size="16" font-weight="700">02</text><text x="148" y="357" fill="#4fb3bf" font-size="11.6" font-weight="700" letter-spacing="1">UNRESTRICTED ACL</text><text x="148" y="394" font-size="20" font-weight="650" fill="#e8e9ec">Default ACL: nopass, +@all</text><text x="148" y="434" font-size="15" fill="#aeb5c1">Enabled default user allows all command categories</text></g>
<g><rect x="122" y="487" width="608" height="136" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="122" y="503" width="4" height="104" rx="2" fill="#4fb3bf"/><circle cx="79" cy="555" r="20" fill="#1c1f26" stroke="#4fb3bf" stroke-width="2"/><text x="79" y="560.5" text-anchor="middle" fill="#e8e9ec" font-size="16" font-weight="700">03</text><text x="148" y="513" fill="#4fb3bf" font-size="11.6" font-weight="700" letter-spacing="1">WRITE PRIMITIVE</text><text x="148" y="550" font-size="20" font-weight="650" fill="#e8e9ec">CONFIG SET and SAVE available</text><text x="148" y="590" font-size="15" fill="#aeb5c1">Change persistence path/name; trigger an RDB write</text></g>
