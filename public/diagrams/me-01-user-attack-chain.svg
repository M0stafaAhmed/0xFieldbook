<text x="39" y="96" fill="#e8e9ec" font-size="34" font-weight="700">From file disclosure to RCE</text>
<text x="39" y="130" fill="#9aa0ad" font-size="16.5">15 original stages · Traversal → source → API key → command execution</text>
