<title id="me-user-title">ME-01 user-level attack chain — all 15 documented stages</title>
<desc id="me-user-desc">IT GATE File Service, download API path traversal, reading /etc/passwd to find svc, /proc/self/cmdline and app.py source disclosure, config API_KEY recovery, X-API-Key authentication, /api/ping host command injection, and confirmed remote code execution as svc. User flag /home/svc/user.txt obtained via arbitrary file read and submitted. Sensitive values withheld.</desc>
