    <text x="146" y="610" font-size="11.8" font-weight="700" letter-spacing="1.2" fill="#d4922a">MISCONFIGURATION</text>
    <text x="146" y="643" font-size="20.3" font-weight="650" fill="#e8e9ec">Discover NOPASSWD: /usr/bin/find</text>
    <text x="146" y="675" font-size="15.1" fill="#aeb5c1">sudo allows www-data to run find as root without a password</text>
  </g>
<g>
