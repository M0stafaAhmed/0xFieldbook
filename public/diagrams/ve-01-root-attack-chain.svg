    <text x="146" y="919" font-size="20.3" font-weight="650" fill="#e8e9ec">Execute find through sudo</text>
    <text x="146" y="951" font-size="15.1" fill="#aeb5c1">Run the recorded sudo find payload with -exec and -quit</text>
  </g>
