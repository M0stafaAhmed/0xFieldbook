    <text x="146" y="1057" font-size="20.3" font-weight="650" fill="#e8e9ec">Launch /bin/sh -p</text>
    <text x="146" y="1089" font-size="15.1" fill="#aeb5c1">The -p flag retains the privileged effective identity</text>
  </g>
