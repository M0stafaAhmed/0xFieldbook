    <text x="146" y="781" font-size="20.3" font-weight="650" fill="#e8e9ec">Identify GNU find -exec functionality</text>
    <text x="146" y="813" font-size="15.1" fill="#aeb5c1">GNU find can execute an external program via -exec</text>
  </g>
