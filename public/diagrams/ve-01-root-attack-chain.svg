    <text x="146" y="472" font-size="11.8" font-weight="700" letter-spacing="1.2" fill="#d4922a">PRIVILEGE ENUMERATION</text>
    <text x="146" y="505" font-size="20.3" font-weight="650" fill="#e8e9ec">sudo -l</text>
    <text x="146" y="537" font-size="15.1" fill="#aeb5c1">Check sudoers permissions from the PHP command channel</text>
  </g>
<g>
