 <text x="39" y="96" font-size="33" fill="#e8e9ec" font-weight="700">Complete privilege escalation chain</text>
 <text x="39" y="127" font-size="17" fill="#9aa0ad">Eleven documented steps, from the web foothold to root completion</text>
