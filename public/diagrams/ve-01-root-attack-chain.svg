    <text x="79" y="236.5" font-size="16" text-anchor="middle" fill="#e8e9ec" font-weight="700">01</text>
    <text x="146" y="196" font-size="11.8" font-weight="700" letter-spacing="1.2" fill="#4fb3bf">EXISTING FOOTHOLD</text>
    <text x="146" y="229" font-size="20.3" font-weight="650" fill="#e8e9ec">PHP Command Execution</text>
    <text x="146" y="261" font-size="15.1" fill="#aeb5c1">Execute OS commands through the uploaded PHP endpoint</text>
  </g>
<g>
