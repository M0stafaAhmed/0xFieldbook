    <text x="146" y="367" font-size="20.3" font-weight="650" fill="#e8e9ec">Execution as www-data</text>
    <text x="146" y="399" font-size="15.1" fill="#aeb5c1">Commands run as the web-server account, www-data</text>
  </g>
