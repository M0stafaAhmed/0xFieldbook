<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1758" viewBox="0 0 760 1758" role="img" aria-labelledby="ve-root-title ve-root-desc">
  <title id="ve-root-title">VE-01 root privilege escalation — eleven documented steps</title>
  <desc id="ve-root-desc">PHP command execution as www-data, sudo -l, NOPASSWD find permission, GNU find -exec behavior, privileged find execution, /bin/sh -p, expected effective root UID without preserved raw response, root flag retrieval from /root/root.txt, submission, and VE-01 completion.</desc>
  <rect x="8" y="8" width="744" height="1742" rx="18" fill="#1c1f26" stroke="#3a3f4a"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
