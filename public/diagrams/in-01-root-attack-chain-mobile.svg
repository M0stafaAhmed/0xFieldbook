<svg xmlns="http://www.w3.org/2000/svg" width="380" height="2775" viewBox="0 0 380 2775" role="img" aria-labelledby="inroot-title inroot-desc">
<title id="inroot-title">IN-01 root complete privilege-escalation chain — thirteen original stages</title>
<desc id="inroot-desc">Initial access as web; Enumerate sudo privileges; Discover NOPASSWD healthcheck; Discover env_keep+=LD_PRELOAD; Inspect /usr/local/bin/healthcheck; Identify dynamically linked ELF executable; Confirm GCC availability; Create /tmp/in01_preload.c; Compile /tmp/in01_preload.so; sudo -n LD_PRELOAD=/tmp/in01_preload.so \
    /usr/local/bin/healthcheck; Constructor executes as UID 0 / EUID 0; Read /root/root.txt; ROOT FLAG RETRIEVED. Confirmed sudo LD_PRELOAD constructor execution with UID/EUID/GID/EGID 0 and root flag retrieval; no interactive root shell, cleanup not verified.</desc>
