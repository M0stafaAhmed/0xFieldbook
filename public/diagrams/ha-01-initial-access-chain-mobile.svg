<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="380" height="1595" viewBox="0 0 380 1595" role="img" aria-labelledby="attack-title attack-desc">
<title id="attack-title">HA-01 / INITIAL ACCESS — 7 original steps</title><desc id="attack-desc">Redis exposed without authentication; Default ACL: nopass, +@all; CONFIG SET and SAVE available; Identify /home/devops/.ssh; Prove Redis can write to the directory; RDB snapshot written as authorized_keys; SSH authentication as devops. Public key deployed via Redis RDB; matching private key remained on Kali.</desc>
<rect x="8" y="8" width="364" height="1579" rx="18" fill="#1c1f26" stroke="#3a3f4a"/><g font-family="Inter, Segoe UI, Arial, sans-serif"><text x="25" y="43" fill="#d4922a" font-size="12.2" font-weight="700" letter-spacing="1.1">HA-01 / INITIAL ACCESS</text><text x="25" y="84" fill="#e8e9ec" font-size="25" font-weight="700">Redis persistence to SSH</text><text x="25" y="110" fill="#9aa0ad" font-size="12.5">7 stages · Redis → devops SSH</text><line x1="25" y1="132" x2="355" y2="132" stroke="#3a3f4a"/><line x1="34" y1="264" x2="34" y2="421" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/>
<line x1="34" y1="459" x2="34" y2="616" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/>
