<line x1="34" y1="1044" x2="34" y2="1201" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/>
<line x1="34" y1="1239" x2="34" y2="1396" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/><g><rect x="60" y="157" width="300" height="176" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="173" width="4" height="144" rx="2" fill="#4fb3bf"/><circle cx="34" cy="245" r="16" fill="#1c1f26" stroke="#4fb3bf" stroke-width="2"/><text x="34" y="250" text-anchor="middle" fill="#e8e9ec" font-size="13" font-weight="700">01</text><text x="76" y="183" fill="#4fb3bf" font-size="9.8" font-weight="700" letter-spacing="1">REDIS EXPOSURE</text><text x="76" y="212" font-size="16.1" font-weight="650" fill="#e8e9ec">Redis exposed without</text>
<text x="76" y="233" font-size="16.1" font-weight="650" fill="#e8e9ec">authentication</text><text x="76" y="292" font-size="12.6" fill="#aeb5c1">External Redis accepts access without a</text>
<text x="76" y="312" font-size="12.6" fill="#aeb5c1">password</text></g>
<g><rect x="60" y="352" width="300" height="176" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="368" width="4" height="144" rx="2" fill="#4fb3bf"/><circle cx="34" cy="440" r="16" fill="#1c1f26" stroke="#4fb3bf" stroke-width="2"/><text x="34" y="445" text-anchor="middle" fill="#e8e9ec" font-size="13" font-weight="700">02</text><text x="76" y="378" fill="#4fb3bf" font-size="9.8" font-weight="700" letter-spacing="1">UNRESTRICTED ACL</text><text x="76" y="417" font-size="17.5" font-weight="650" fill="#e8e9ec">Default ACL: nopass, +@all</text><text x="76" y="487" font-size="12.6" fill="#aeb5c1">Enabled default user allows all command</text>
<text x="76" y="507" font-size="12.6" fill="#aeb5c1">categories</text></g>
<g><rect x="60" y="547" width="300" height="176" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="563" width="4" height="144" rx="2" fill="#4fb3bf"/><circle cx="34" cy="635" r="16" fill="#1c1f26" stroke="#4fb3bf" stroke-width="2"/><text x="34" y="640" text-anchor="middle" fill="#e8e9ec" font-size="13" font-weight="700">03</text><text x="76" y="573" fill="#4fb3bf" font-size="9.8" font-weight="700" letter-spacing="1">WRITE PRIMITIVE</text><text x="76" y="602" font-size="16.1" font-weight="650" fill="#e8e9ec">CONFIG SET and SAVE</text>
<text x="76" y="623" font-size="16.1" font-weight="650" fill="#e8e9ec">available</text><text x="76" y="682" font-size="12.6" fill="#aeb5c1">Change persistence path/name; trigger an</text>
<text x="76" y="702" font-size="12.6" fill="#aeb5c1">RDB write</text></g>
<g><rect x="60" y="742" width="300" height="176" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="758" width="4" height="144" rx="2" fill="#4fb3bf"/><circle cx="34" cy="830" r="16" fill="#1c1f26" stroke="#4fb3bf" stroke-width="2"/><text x="34" y="835" text-anchor="middle" fill="#e8e9ec" font-size="13" font-weight="700">04</text><text x="76" y="768" fill="#4fb3bf" font-size="9.8" font-weight="700" letter-spacing="1">ACCOUNT &amp; PATH DISCOVERY</text><text x="76" y="807" font-size="17.5" font-weight="650" fill="#e8e9ec">Identify /home/devops/.ssh</text><text x="76" y="877" font-size="12.6" fill="#aeb5c1">Directory probing identifies devops, not</text>
<text x="76" y="897" font-size="12.6" fill="#aeb5c1">hinted user</text></g>
<g><rect x="60" y="937" width="300" height="176" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="953" width="4" height="144" rx="2" fill="#d4922a"/><circle cx="34" cy="1025" r="16" fill="#1c1f26" stroke="#d4922a" stroke-width="2"/><text x="34" y="1030" text-anchor="middle" fill="#e8e9ec" font-size="13" font-weight="700">05</text><text x="76" y="963" fill="#d4922a" font-size="9.8" font-weight="700" letter-spacing="1">WRITE PERMISSION PROOF</text><text x="76" y="992" font-size="16.1" font-weight="650" fill="#e8e9ec">Prove Redis can write to</text>
<text x="76" y="1013" font-size="16.1" font-weight="650" fill="#e8e9ec">the directory</text><text x="76" y="1072" font-size="12.6" fill="#aeb5c1">SAVE of harmless ha01-write-probe.rdb</text>
<text x="76" y="1092" font-size="12.6" fill="#aeb5c1">succeeds</text></g>
<g><rect x="60" y="1132" width="300" height="176" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="1148" width="4" height="144" rx="2" fill="#d4922a"/><circle cx="34" cy="1220" r="16" fill="#1c1f26" stroke="#d4922a" stroke-width="2"/><text x="34" y="1225" text-anchor="middle" fill="#e8e9ec" font-size="13" font-weight="700">06</text><text x="76" y="1158" fill="#d4922a" font-size="9.8" font-weight="700" letter-spacing="1">SSH KEY PLACEMENT</text><text x="76" y="1187" font-size="16.1" font-weight="650" fill="#e8e9ec">RDB snapshot written as</text>
<text x="76" y="1208" font-size="16.1" font-weight="650" fill="#e8e9ec">authorized_keys</text><text x="76" y="1267" font-size="12.6" fill="#aeb5c1">Store padded Ed25519 public key; SAVE</text>
<text x="76" y="1287" font-size="12.6" fill="#aeb5c1">authorized_keys</text></g>
<g><rect x="60" y="1327" width="300" height="176" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="1343" width="4" height="144" rx="2" fill="#4fae6c"/><circle cx="34" cy="1415" r="16" fill="#1c1f26" stroke="#4fae6c" stroke-width="2"/><text x="34" y="1420" text-anchor="middle" fill="#e8e9ec" font-size="13" font-weight="700">07</text><text x="76" y="1353" fill="#4fae6c" font-size="9.8" font-weight="700" letter-spacing="1">USER ACCESS</text><text x="76" y="1382" font-size="16.1" font-weight="650" fill="#e8e9ec">SSH authentication as</text>
<text x="76" y="1403" font-size="16.1" font-weight="650" fill="#e8e9ec">devops</text><text x="76" y="1462" font-size="12.6" fill="#aeb5c1">Private key stays on Kali; login</text>
<text x="76" y="1482" font-size="12.6" fill="#aeb5c1">confirmed as devops</text></g><text x="25" y="1552" fill="#8b93a1" font-size="11.2">Private key stays on Kali</text></g>
