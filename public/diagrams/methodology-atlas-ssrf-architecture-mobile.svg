<svg xmlns="http://www.w3.org/2000/svg" width="430" height="935" viewBox="0 0 430 935" data-layout="sequence" role="img" aria-labelledby="atlas-title atlas-desc">
<title id="atlas-title">SSRF / server-side request sequence</title>
<desc id="atlas-desc">Original source stages: Attacker → Public Web Application → Server-Side HTTP Client → External or Internal Resource → Public Web Application → Attacker. Original labeled messages: GET /fetch?url=https://example.com; Validate supplied URL; Request destination; Response; Return fetched content Methodological diagram; follow supporting evidence and limitations in page text.</desc>
<defs><pattern id="atlas-dot" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#8d9693" opacity=".19"/></pattern></defs>
<rect width="430" height="935" rx="10" fill="#f5f3eb"/>
<rect width="430" height="935" rx="10" fill="url(#atlas-dot)"/>
<path d="M24 19H406" stroke="#9d5948" stroke-width="3"/>
<text x="25" y="48" font-family="Consolas,monospace" fill="#9d5948" font-size="11" letter-spacing="1.6" font-weight="700">0XFIELD  /  METHODOLOGY ATLAS</text>
<text x="25" y="82" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="19.7" fill="#142e3c">SSRF — server-side request sequence</text>
<text x="25" y="110" font-family="Consolas,monospace" font-size="11.5" font-weight="700" fill="#9d5948">MESSAGE SEQUENCE  ·  6 ORIGINAL STAGES</text>
<path d="M25 132H405" stroke="#91a0a0" stroke-width="1" opacity=".68"/>
