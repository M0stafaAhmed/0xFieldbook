<text x="35" y="337" font-family="Arial,Helvetica,sans-serif" font-size="12.1" font-weight="700" text-anchor="start" fill="#9d5948"><tspan x="35" dy="0">Public Web Application</tspan></text>
<text x="398" y="337" font-family="Arial,Helvetica,sans-serif" font-size="12.1" font-weight="700" text-anchor="end" fill="#9d5948"><tspan x="398" dy="0">Server-Side HTTP Client</tspan></text>
<path d="M125 368H302" stroke="#9d5948" stroke-width="1.8" stroke-linejoin="round" fill="none" opacity=".85"/><path d="M295 363L302 368L295 373" stroke="#9d5948" stroke-width="1.8" fill="none"/>
<text x="215" y="403" font-family="Arial,Helvetica,sans-serif" font-size="12.4" font-weight="600" text-anchor="middle" fill="#263943"><tspan x="215" dy="0">Validate supplied URL</tspan></text>
</g>
<g id="message-03"><desc>Request destination</desc>
