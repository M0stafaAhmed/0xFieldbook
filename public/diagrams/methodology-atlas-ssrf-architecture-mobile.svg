<text x="215" y="681" font-family="Arial,Helvetica,sans-serif" font-size="12.4" font-weight="600" text-anchor="middle" fill="#263943"><tspan x="215" dy="0">Response</tspan></text>
</g>
<g id="message-05"><desc>Return fetched content</desc>
<path d="M28 726H402" stroke="#a4b7ae" stroke-width=".85"/>
<text x="35" y="754" font-family="Arial,Helvetica,sans-serif" font-size="12.1" font-weight="700" text-anchor="start" fill="#9d5948"><tspan x="35" dy="0">Public Web Application</tspan></text>
<text x="398" y="754" font-family="Arial,Helvetica,sans-serif" font-size="12.1" font-weight="700" text-anchor="end" fill="#9d5948"><tspan x="398" dy="0">Attacker</tspan></text>
<path d="M125 785H302" stroke="#9d5948" stroke-width="1.8" stroke-linejoin="round" fill="none" opacity=".85"/><path d="M295 780L302 785L295 790" stroke="#9d5948" stroke-width="1.8" fill="none"/>
<text x="215" y="820" font-family="Arial,Helvetica,sans-serif" font-size="12.4" font-weight="600" text-anchor="middle" fill="#263943"><tspan x="215" dy="0">Return fetched content</tspan></text>
</g>
<g id="stage-index"><desc id="stage-01">Attacker</desc><desc id="stage-02">Public Web Application</desc><desc id="stage-03">Server-Side HTTP Client</desc><desc id="stage-04">External or Internal Resource</desc><desc id="stage-05">Public Web Application</desc><desc id="stage-06">Attacker</desc></g>
