<text x="398" y="198" font-family="Arial,Helvetica,sans-serif" font-size="12.1" font-weight="700" text-anchor="end" fill="#9d5948"><tspan x="398" dy="0">Public Web Application</tspan></text>
<path d="M125 229H302" stroke="#9d5948" stroke-width="1.8" stroke-linejoin="round" fill="none" opacity=".85"/><path d="M295 224L302 229L295 234" stroke="#9d5948" stroke-width="1.8" fill="none"/>
<text x="215" y="264" font-family="Arial,Helvetica,sans-serif" font-size="12.4" font-weight="600" text-anchor="middle" fill="#263943"><tspan x="215" dy="0">GET /fetch?url=https://example.com</tspan></text>
</g>
<g id="message-02"><desc>Validate supplied URL</desc>
