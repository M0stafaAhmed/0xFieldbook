<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 1030" width="380" height="1030" role="img" aria-labelledby="ve-title ve-description">
<title id="ve-title">VE-01 attack chain — from file upload to root</title>
<desc id="ve-description">Six stages: file upload vulnerability, uploaded PHP command execution as www-data, home directory enumeration, user flag submission, sudo find -exec privilege escalation to UID zero, and root flag submission.</desc>
<rect x="8" y="8" width="364" height="1014" rx="18" fill="#1c1f26" stroke="#3a3f4a"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif"><text x="26" y="43" fill="#d4922a" font-size="13" font-weight="700" letter-spacing="2">VE-01 / ATTACK CHAIN</text><text x="26" y="83" fill="#e8e9ec" font-size="27" font-weight="700">From upload to root</text><text x="26" y="108" fill="#9aa0ad" font-size="13">Documented training-exam path</text><line x1="25" y1="125" x2="355" y2="125" stroke="#3a3f4a"/><line x1="37" x2="37" y1="220.5" y2="325.5" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/>
<line x1="37" x2="37" y1="362.5" y2="467.5" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/>
<line x1="37" x2="37" y1="504.5" y2="609.5" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/>
<line x1="37" x2="37" y1="646.5" y2="751.5" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/>
<line x1="37" x2="37" y1="788.5" y2="893.5" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/><g><rect x="64" y="140" width="295" height="125" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="64" y="157" width="4" height="91" rx="2" fill="#4fb3bf"/><circle cx="37" cy="202.5" r="16" fill="#1c1f26" stroke="#4fb3bf" stroke-width="2"/><text x="37" y="207" text-anchor="middle" fill="#e8e9ec" font-size="13" font-weight="700">01</text><text x="82" y="167" fill="#4fb3bf" font-size="10.5" font-weight="700" letter-spacing="1.3">INITIAL ACCESS</text><text x="82" y="200" fill="#e8e9ec" font-size="19" font-weight="650">Web application</text><text x="82" y="224" fill="#aeb5c1" font-size="13.3">File-upload flaw on HTTP site</text><text x="82" y="246" fill="#aeb5c1" font-size="13.3">PHP entry point identified</text></g>
<g><rect x="64" y="282" width="295" height="125" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="64" y="299" width="4" height="91" rx="2" fill="#4fb3bf"/><circle cx="37" cy="344.5" r="16" fill="#1c1f26" stroke="#4fb3bf" stroke-width="2"/><text x="37" y="349" text-anchor="middle" fill="#e8e9ec" font-size="13" font-weight="700">02</text><text x="82" y="309" fill="#4fb3bf" font-size="10.5" font-weight="700" letter-spacing="1.3">COMMAND EXECUTION</text><text x="82" y="342" fill="#e8e9ec" font-size="19" font-weight="650">Uploaded PHP file</text><text x="82" y="366" fill="#aeb5c1" font-size="13.3">Upload PHP file to the server</text><text x="82" y="388" fill="#aeb5c1" font-size="13.3">Commands via file.php?cmd=</text></g>
<g><rect x="64" y="424" width="295" height="125" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="64" y="441" width="4" height="91" rx="2" fill="#4fb3bf"/><circle cx="37" cy="486.5" r="16" fill="#1c1f26" stroke="#4fb3bf" stroke-width="2"/><text x="37" y="491" text-anchor="middle" fill="#e8e9ec" font-size="13" font-weight="700">03</text><text x="82" y="451" fill="#4fb3bf" font-size="10.5" font-weight="700" letter-spacing="1.3">EXECUTION CONTEXT</text><text x="82" y="484" fill="#e8e9ec" font-size="19" font-weight="650">www-data</text><text x="82" y="508" fill="#aeb5c1" font-size="13.3">Commands run as www-data</text><text x="82" y="530" fill="#aeb5c1" font-size="13.3">Enumerate /home; identify user</text></g>
<g><rect x="64" y="566" width="295" height="125" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="64" y="583" width="4" height="91" rx="2" fill="#4fae6c"/><circle cx="37" cy="628.5" r="16" fill="#1c1f26" stroke="#4fae6c" stroke-width="2"/><text x="37" y="633" text-anchor="middle" fill="#e8e9ec" font-size="13" font-weight="700">04</text><text x="82" y="593" fill="#4fae6c" font-size="10.5" font-weight="700" letter-spacing="1.3">USER OBJECTIVE</text><text x="82" y="626" fill="#e8e9ec" font-size="19" font-weight="650">User flag submitted</text><text x="82" y="650" fill="#aeb5c1" font-size="13.3">Read /home/user/user.txt</text><text x="82" y="672" fill="#aeb5c1" font-size="13.3">Submit the user flag</text></g>
<g><rect x="64" y="708" width="295" height="125" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="64" y="725" width="4" height="91" rx="2" fill="#d4922a"/><circle cx="37" cy="770.5" r="16" fill="#1c1f26" stroke="#d4922a" stroke-width="2"/><text x="37" y="775" text-anchor="middle" fill="#e8e9ec" font-size="13" font-weight="700">05</text><text x="82" y="735" fill="#d4922a" font-size="10.5" font-weight="700" letter-spacing="1.3">PRIVILEGE ESCALATION</text><text x="82" y="768" fill="#e8e9ec" font-size="19" font-weight="650">sudo find -exec</text><text x="82" y="792" fill="#aeb5c1" font-size="13.3">sudo: /usr/bin/find as root</text><text x="82" y="814" fill="#aeb5c1" font-size="13.3">find -exec → effective UID 0</text></g>
<g><rect x="64" y="850" width="295" height="125" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="64" y="867" width="4" height="91" rx="2" fill="#4fae6c"/><circle cx="37" cy="912.5" r="16" fill="#1c1f26" stroke="#4fae6c" stroke-width="2"/><text x="37" y="917" text-anchor="middle" fill="#e8e9ec" font-size="13" font-weight="700">06</text><text x="82" y="877" fill="#4fae6c" font-size="10.5" font-weight="700" letter-spacing="1.3">ROOT OBJECTIVE</text><text x="82" y="910" fill="#e8e9ec" font-size="19" font-weight="650">Root flag submitted</text><text x="82" y="934" fill="#aeb5c1" font-size="13.3">Read /root/root.txt</text><text x="82" y="956" fill="#aeb5c1" font-size="13.3">Submit the root flag</text></g><text x="26" y="1006" fill="#8b93a1" font-size="11">Flag values are redacted</text></g>
</svg>