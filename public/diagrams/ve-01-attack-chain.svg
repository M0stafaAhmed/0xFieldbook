<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1070" width="760" height="1070" role="img" aria-labelledby="ve-title ve-description">
<title id="ve-title">VE-01 attack chain — from file upload to root</title>
<desc id="ve-description">Six stages: file upload vulnerability, uploaded PHP command execution as www-data, home directory enumeration, user flag submission, sudo find -exec privilege escalation to UID zero, and root flag submission.</desc>
<rect x="8" y="8" width="744" height="1054" rx="18" fill="#1c1f26" stroke="#3a3f4a"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif"><text x="40" y="49" fill="#d4922a" font-size="14" font-weight="700" letter-spacing="2.5">VE-01 / ATTACK CHAIN</text><text x="40" y="96" fill="#e8e9ec" font-size="34" font-weight="700">From upload to root</text><text x="40" y="128" fill="#9aa0ad" font-size="17">Six stages: from web upload to root escalation</text><line x1="35" y1="146" x2="725" y2="146" stroke="#3a3f4a"/><line x1="79" x2="79" y1="250" y2="343" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/>
<line x1="79" x2="79" y1="388" y2="481" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/>
<line x1="79" x2="79" y1="526" y2="619" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/>
<line x1="79" x2="79" y1="664" y2="757" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/>
<line x1="79" x2="79" y1="802" y2="895" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/><g><rect x="124" y="169" width="605" height="118" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="124" y="186" width="4" height="84" rx="2" fill="#4fb3bf"/><circle cx="79" cy="228" r="20" fill="#1c1f26" stroke="#4fb3bf" stroke-width="2"/><text x="79" y="233.5" text-anchor="middle" fill="#e8e9ec" font-size="16" font-weight="700">01</text><text x="150" y="196" fill="#4fb3bf" font-size="12.5" font-weight="700" letter-spacing="1.3">INITIAL ACCESS</text><text x="150" y="229" fill="#e8e9ec" font-size="23" font-weight="650">Web application</text><text x="150" y="263" fill="#aeb5c1" font-size="16.5">File-upload vulnerability exposes a PHP entry point</text></g>
<g><rect x="124" y="307" width="605" height="118" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="124" y="324" width="4" height="84" rx="2" fill="#4fb3bf"/><circle cx="79" cy="366" r="20" fill="#1c1f26" stroke="#4fb3bf" stroke-width="2"/><text x="79" y="371.5" text-anchor="middle" fill="#e8e9ec" font-size="16" font-weight="700">02</text><text x="150" y="334" fill="#4fb3bf" font-size="12.5" font-weight="700" letter-spacing="1.3">COMMAND EXECUTION</text><text x="150" y="367" fill="#e8e9ec" font-size="23" font-weight="650">Uploaded PHP file</text><text x="150" y="401" fill="#aeb5c1" font-size="16.5">PHP command execution is available via file.php?cmd=</text></g>
<g><rect x="124" y="445" width="605" height="118" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="124" y="462" width="4" height="84" rx="2" fill="#4fb3bf"/><circle cx="79" cy="504" r="20" fill="#1c1f26" stroke="#4fb3bf" stroke-width="2"/><text x="79" y="509.5" text-anchor="middle" fill="#e8e9ec" font-size="16" font-weight="700">03</text><text x="150" y="472" fill="#4fb3bf" font-size="12.5" font-weight="700" letter-spacing="1.3">EXECUTION CONTEXT</text><text x="150" y="505" fill="#e8e9ec" font-size="23" font-weight="650">www-data</text><text x="150" y="539" fill="#aeb5c1" font-size="16.5">Enumerate /home and identify the target user</text></g>
<g><rect x="124" y="583" width="605" height="118" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="124" y="600" width="4" height="84" rx="2" fill="#4fae6c"/><circle cx="79" cy="642" r="20" fill="#1c1f26" stroke="#4fae6c" stroke-width="2"/><text x="79" y="647.5" text-anchor="middle" fill="#e8e9ec" font-size="16" font-weight="700">04</text><text x="150" y="610" fill="#4fae6c" font-size="12.5" font-weight="700" letter-spacing="1.3">USER OBJECTIVE</text><text x="150" y="643" fill="#e8e9ec" font-size="23" font-weight="650">User flag submitted</text><text x="150" y="677" fill="#aeb5c1" font-size="16.5">Read /home/user/user.txt, then submit the flag</text></g>
<g><rect x="124" y="721" width="605" height="118" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="124" y="738" width="4" height="84" rx="2" fill="#d4922a"/><circle cx="79" cy="780" r="20" fill="#1c1f26" stroke="#d4922a" stroke-width="2"/><text x="79" y="785.5" text-anchor="middle" fill="#e8e9ec" font-size="16" font-weight="700">05</text><text x="150" y="748" fill="#d4922a" font-size="12.5" font-weight="700" letter-spacing="1.3">PRIVILEGE ESCALATION</text><text x="150" y="781" fill="#e8e9ec" font-size="23" font-weight="650">sudo find -exec</text><text x="150" y="815" fill="#aeb5c1" font-size="16.5">www-data runs /usr/bin/find as root; gain UID 0</text></g>
<g><rect x="124" y="859" width="605" height="118" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="124" y="876" width="4" height="84" rx="2" fill="#4fae6c"/><circle cx="79" cy="918" r="20" fill="#1c1f26" stroke="#4fae6c" stroke-width="2"/><text x="79" y="923.5" text-anchor="middle" fill="#e8e9ec" font-size="16" font-weight="700">06</text><text x="150" y="886" fill="#4fae6c" font-size="12.5" font-weight="700" letter-spacing="1.3">ROOT OBJECTIVE</text><text x="150" y="919" fill="#e8e9ec" font-size="23" font-weight="650">Root flag submitted</text><text x="150" y="953" fill="#aeb5c1" font-size="16.5">Read /root/root.txt, then submit the root flag</text></g><text x="40" y="1031" fill="#8b93a1" font-size="14">Flag values omitted · User/root completion participant-confirmed</text></g>
</svg>