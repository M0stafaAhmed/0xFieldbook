<text x="39" y="97" font-size="34" fill="#e8e9ec" font-weight="700">Complete privilege-escalation chain</text>
<text x="39" y="130" font-size="16.5" fill="#9aa0ad">10 original stages · Linux capabilities, not SUID or sudo</text>
