<title id="me-root-title">ME-01 root privilege escalation — 10 original connected stages</title>
<desc id="me-root-description">Authenticated command injection as svc, SUID enumeration and negative finding, Linux capability enumeration, root-owned pyadmin with cap_setuid=ep, Python execution, os.setuid(0), captured real UID and effective UID transitioning from 1000 to 0, root flag retrieval and submission. Root was achieved inside the application container, with no container escape or host-root evidence.</desc>
