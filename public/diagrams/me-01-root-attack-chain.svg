<g><rect x="122" y="311" width="608" height="119" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="122" y="326" width="4" height="89" rx="2" fill="#d4922a"/><circle cx="79" cy="370.5" r="20" stroke="#d4922a" stroke-width="2" fill="#1c1f26"/><text x="79" y="376" text-anchor="middle" font-size="16" font-weight="700" fill="#e8e9ec">02</text><text x="145" y="335" font-size="11.7" font-weight="700" letter-spacing="1" fill="#d4922a">SUID ENUMERATION</text><text x="145" y="368" font-size="20.3" font-weight="650" fill="#e8e9ec">Enumerate SUID binaries</text><text x="145" y="408" font-size="15" fill="#aeb5c1">Run find / -type f -perm -4000 -ls 2&gt;/dev/null</text></g>
