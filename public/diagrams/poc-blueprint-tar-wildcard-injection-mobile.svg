<svg xmlns="http://www.w3.org/2000/svg" width="430" height="1998" viewBox="0 0 430 1998" role="img" aria-labelledby="poc-title poc-description">
<title id="poc-title">TAR WILDCARD — exploitation blueprint</title>
<desc id="poc-description">Technical diagram of the original PoC stages: devops → Enumerate cron jobs → Discover /etc/cron.d/maint → Identify root execution of backup.sh → Inspect backup.sh → Discover unquoted wildcard:
tar ... * → Confirm spool directory is writable → Create root-flag.sh → Create maliciously named files → Root cron executes backup.sh → GNU tar interprets filenames as options → Checkpoint action executes root-flag.sh → Retrieve /root/root.txt. . .</desc>
