<text x="76" y="226" font-size="16.8" font-weight="650" fill="#e8e9ec">injection as svc</text><text x="76" y="266" font-size="12.6" fill="#aeb5c1">X-API-Key-authenticated RCE</text><text x="76" y="287" font-size="12.6" fill="#aeb5c1">Execution account: svc</text></g>
<g><rect x="60" y="321" width="300" height="151" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="336" width="4" height="121" rx="2" fill="#d4922a"/><circle cx="34" cy="396.5" r="16" stroke="#d4922a" stroke-width="2" fill="#1c1f26"/><text x="34" y="401" text-anchor="middle" font-size="13" font-weight="700" fill="#e8e9ec">02</text><text x="76" y="345" font-size="10" font-weight="700" letter-spacing="1" fill="#d4922a">SUID ENUMERATION</text><text x="76" y="385" font-size="17.6" font-weight="650" fill="#e8e9ec">Enumerate SUID binaries</text><text x="76" y="435" font-size="12.6" fill="#aeb5c1">find / -type f -perm -4000</text><text x="76" y="456" font-size="12.6" fill="#aeb5c1">Inspect privileged executables</text></g>
