<text x="76" y="1071" font-size="16.8" font-weight="650" fill="#e8e9ec">pyadmin</text><text x="76" y="1111" font-size="12.6" fill="#aeb5c1">pyadmin is Python 3.11.18</text><text x="76" y="1132" font-size="12.6" fill="#aeb5c1">Runs with CAP_SETUID capability</text></g>
