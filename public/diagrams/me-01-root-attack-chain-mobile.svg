<g><rect x="60" y="828" width="300" height="151" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="843" width="4" height="121" rx="2" fill="#d4922a"/><circle cx="34" cy="903.5" r="16" stroke="#d4922a" stroke-width="2" fill="#1c1f26"/><text x="34" y="908" text-anchor="middle" font-size="13" font-weight="700" fill="#e8e9ec">05</text><text x="76" y="852" font-size="10" font-weight="700" letter-spacing="1" fill="#d4922a">CAPABILITY FINDING</text><text x="76" y="879" font-size="16.8" font-weight="650" fill="#e8e9ec">/usr/local/bin/pyadmin</text>
<text x="76" y="902" font-size="16.8" font-weight="650" fill="#e8e9ec">cap_setuid=ep</text><text x="76" y="942" font-size="12.6" fill="#aeb5c1">getcap finds cap_setuid=ep</text><text x="76" y="963" font-size="12.6" fill="#aeb5c1">pyadmin owned by root, mode 755</text></g>
