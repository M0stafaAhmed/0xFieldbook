y="2064" width="4" height="86" rx="2" fill="#4fae6c"/><circle cx="79" cy="2107" r="20" fill="#1c1f26" stroke="#4fae6c" stroke-width="2"/><text x="79" y="2112.5" text-anchor="middle" font-size="16" font-weight="700" fill="#e8e9ec">15</text><text x="147" y="2072" font-size="11.6" fill="#4fae6c" font-weight="700" letter-spacing="1">RCE PROVEN</text><text x="147" y="2105" fill="#e8e9ec" font-size="20" font-weight="650">Confirm command execution as web</text><text x="147" y="2139" fill="#aeb5c1" font-size="14.6">Captured id returned uid=1000(web); cwd /opt/app</text></g><g><rect x="122" y="2183" width="608" height="116" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="122" y="2198" width="4" height="86" rx="2" fill="#d4922a"/><circle cx="79" cy="2241" r="20" fill="#1c1f26" stroke="#d4922a" stroke-width="2"/><text x="79" y="2246.5" text-anchor="middle" font-size="16" font-weight="700" fill="#e8e9ec">16</text><text x="147" y="2206" font-size="11.6" fill="#d4922a" font-weight="700" letter-spacing="1">CALLBACK TEST</text><text x="147" y="2239" fill="#e8e9ec" font-size="20" font-weight="650">Attempt reverse shell</text><text x="147" y="2273" fill="#aeb5c1" font-size="14.6">Bash callbacks attempted over VPN interfaces</text></g><g><rect x="122" y="2317" width="608" height="116" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="122" y="2332" width="4" height="86" rx="2" fill="#c9a85a"/><circle cx="79" cy="2375" r="20" fill="#1c1f26" stroke="#c9a85a" stroke-width="2"/><text x="79" y="2380.5" text-anchor="middle" font-size="16" font-weight="700" fill="#e8e9ec">17</text><text x="147" y="2340" font-size="11.6" fill="#c9a85a" font-weight="700" letter-spacing="1">NEGATIVE RESULT</text><text x="147" y="2373" fill="#e8e9ec" font-size="20" font-weight="650">Callback unsuccessful</text><text x="147" y="2407" fill="#aeb5c1" font-size="14.6">Neither listener received a shell; reason unverified</text></g><g><rect x="122" y="2451" width="608" height="116" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="122" y="2466" width="4" height="86" rx="2" fill="#4fae6c"/><circle cx="79" cy="2509" r="20" fill="#1c1f26" stroke="#4fae6c" stroke-width="2"/><text x="79" y="2514.5" text-anchor="middle" font-size="16" font-weight="700" fill="#e8e9ec">18</text><text x="147" y="2474" font-size="11.6" fill="#4fae6c" font-weight="700" letter-spacing="1">IN-BAND RCE</text><text x="147" y="2507" fill="#e8e9ec" font-size="20" font-weight="650">Continue using in-band command execution</text><text x="147" y="2541" fill="#aeb5c1" font-size="14.6">ssrf_exec returned command output in HTTP responses</text></g><g><rect x="122" y="2585" width="608" height="116" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="122" y="2600" width="4" height="86" rx="2" fill="#4fae6c"/><circle cx="79" cy="2643" r="20" fill="#1c1f26" stroke="#4fae6c" stroke-width="2"/><text x="79" y="2648.5" text-anchor="middle" font-size="16" font-weight="700" fill="#e8e9ec">19</text><text x="147" y="2608" font-size="11.6" fill="#4fae6c" font-weight="700" letter-spacing="1">USER OBJECTIVE</text><text x="147" y="2641" fill="#e8e9ec" font-size="20" font-weight="650">Issue user.txt retrieval command</text><text x="147" y="2675" fill="#aeb5c1" font-size="14.6">cat /home/$(whoami)/user.txt; flag participant-confirmed</text></g><text x="39" y="2728" font-size="14" fill="#8b93a1">Callback attempts failed; VPN routing was not confirmed as the cause</text><text x="39" y="2751" font-size="14" fill="#8b93a1">In-band HTTP command execution remained operational after the failed callbacks</text><text x="39" y="2774" font-size="14" fill="#8b93a1">User flag submission participant-confirmed; raw value withheld</text></g></svg>