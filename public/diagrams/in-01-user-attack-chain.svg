<svg xmlns="http://www.w3.org/2000/svg" width="760" height="2809" viewBox="0 0 760 2809" role="img" aria-labelledby="chain-title chain-desc">
<title id="chain-title">IN-01 User attack chain — nineteen complete stages</title>
<desc id="chain-desc">Enumerate assigned HTTP and SSH services; Fingerprint public Gunicorn application; Confirm server-side fetching through /fetch; Test canonical loopback addresses; Identify alternative loopback representations; Confirm 127.1 reaches internal connection stage; Discover internal services through port enumeration; Identify internal Admin API on port 9000; Fuzz API routes; Discover /admin/exec; Fuzz request parameters; Identify data parameter; Identify Base64 decoding and Pickle deserialization; Craft malicious Pickle object; Confirm command execution as web; Attempt reverse shell; Callback unsuccessful; Continue using in-band command execution; Issue user.txt retrieval command. Reverse-shell callbacks were unsuccessful; cause not established. In-band command execution remained active and user flag was participant-confirmed.</desc>
<rect x="8" y="8" width="744" height="2793" rx="18" fill="#1c1f26" stroke="#3a3f4a"/>
