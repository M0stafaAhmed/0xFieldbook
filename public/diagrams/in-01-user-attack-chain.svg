nt-size="20" font-weight="650">Confirm server-side fetching through /fetch</text><text x="147" y="531" fill="#aeb5c1" font-size="14.6">/fetch?url= retrieves remote content using the server</text></g><g><rect x="122" y="575" width="608" height="116" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="122" y="590" width="4" height="86" rx="2" fill="#4fb3bf"/><circle cx="79" cy="633" r="20" fill="#1c1f26" stroke="#4fb3bf" stroke-width="2"/><text x="79" y="638.5" text-anchor="middle" font-size="16" font-weight="700" fill="#e8e9ec">04</text><text x="147" y="598" font-size="11.6" fill="#4fb3bf" font-weight="700" letter-spacing="1">FILTER TEST</text><text x="147" y="631" fill="#e8e9ec" font-size="20" font-weight="650">Test canonical loopback addresses</text><text x="147" y="665" fill="#aeb5c1" font-size="14.6">localhost and 127.0.0.1 blocked with 403 responses</text></g><g><rect x="122" y="709" width="608" height="116" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="122" y="724" width="4" height="86" rx="2" fill="#4fb3bf"/><circle cx="79" cy="767" r="20" fill="#1c1f26" stroke="#4fb3bf" stroke-width="2"/><text x="79" y="772.5" text-anchor="middle" font-size="16" font-weight="700" fill="#e8e9ec">05</text><text x="147" y="732" font-size="11.6" fill="#4fb3bf" font-weight="700" letter-spacing="1">BYPASS FINDING</text><text x="147" y="765" fill="#e8e9ec" font-size="20" font-weight="650">Identify alternative loopback representations</text><text x="147" y="799" fill="#aeb5c1" font-size="14.6">Numeric loopback forms such as 127.1 bypassed filter logic</text></g><g><rect x="122" y="843" width="608" height="116" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="122" y="858" width="4" height="86" rx="2" fill="#4fb3bf"/><circle cx="79" cy="901" r="20" fill="#1c1f26" stroke="#4fb3bf" stroke-width="2"/><text x="79" y="906.5" text-anchor="middle" font-size="16" font-weight="700" fill="#e8e9ec">06</text><text x="147" y="866" font-size="11.6" fill="#4fb3bf" font-weight="700" letter-spacing="1">CONTROL PROOF</text><text x="147" y="899" fill="#e8e9ec" font-size="20" font-weight="650">Confirm 127.1 reaches internal connection stage</text><text x="147" y="933" fill="#aeb5c1" font-size="14.6">502 refusal on unused port 80 showed a connection attempt</text></g><g><rect x="122" y="977" width="608" height="116" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="122" y="992" width="4" height="86" rx="2" fill="#4fb3bf"/><circle cx="79" cy="1035" r="20" fill="#1c1f26" stroke="#4fb3bf" stroke-width="2"/><text x="79" y="1040.5" text-anchor="middle" font-size="16" font-weight="700" fill="#e8e9ec">07</text><text x="147" y="1000" font-size="11.6" fill="#4fb3bf" font-weight="700" letter-spacing="1">INTERNAL ENUM</text><text x="147" y="1024" fill="#e8e9ec" font-size="18.7" font-weight="650">Discover internal services through port</text><text x="147" y="1045" fill="#e8e9ec" font-size="18.7" font-weight="650">enumeration</text><text x="147" y="1067" fill="#aeb5c1" font-size="14.6">FFUF probed ports through the server-side fetch path</text></g><g><rect x="122" y="1111" width="608" height="116" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="122" y="1126" width="4" height="86" rx="2" fill="#4fb3bf"/><circle cx="79" cy="1169" r="20" fill="#1c1f26" stroke="#4fb3bf" stroke-width="2"/><text x="79" y="1174.5" text-anchor="middle" font-size="16" font-weight="700" fill="#e8e9ec">08</text><text x="147" y="1134" font-size="11.6" fill="#4fb3bf" font-weight="700" letter-spacing="1">ADMIN API</text><text x="147" y="1167" fill="#e8e9ec" font-size="20" font-weight="650">Identify internal Admin API on port 9000</text><text x="147" y="1201" fill="#aeb5c1" font-size="14.6">127.1:9000 exposed the localhost-only Admin API</text></g><g><rect x="122" y="1245" width="608" height="116" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="122" y="1260" width="4" height="86" rx="2" fill="#d4922a"/><circle cx="79" cy="1303" r="20" fill="#1c1f26" stroke="#d4922a" stroke-width="2"/><text x="79" y="1308.5" text-anchor="middle" font-size="16" font-weight="700" fill="#e8e9ec">09</text><text x="147" y="1268" font-size="11.6" fill="#d4922a" font-weight="700" letter-spacing="1">ROUTE FUZZ</text><text x="147" y="1301" fill="#e8e9ec" font-size="20" font-weight="650">Fuzz API routes</text><text x="147" y="1335" fill="#aeb5c1" font-size="14.6">API wordlists and negative controls distinguished responses</text></g><g><rect x="122" y="1379" width="608" height="116" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="122" y="1394" width="4" height="86" rx="2" fill="#d4922a"/><circle cx="79" cy="1437" r="20" fill="#1c1f26" stroke="#d4922a" stroke-width="2"/><text x="79" y="1442.5" text-anchor="middle" font-size="16" font-weight="700" fill="#e8e9ec">10</text><text x="147" y="1402" font-size="11.6" fill="#d4922a" font-weight="700" letter-spacing="1">ROUTE FOUND</text><text x="147" y="1435" fill="#e8e9ec" font-size="20" font-weight="650">Discover /admin/exec</text><text x="147" y="1469" fill="#aeb5c1" font-size="14.6">The internal API exposed its execution endpoint</text></g><g><rect x="122" y="1513" width="608" height="116" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="122" y="1528" width="4" height="86" rx="2" fill="#d4922a"/><circle cx="79" cy="1571" r="20" fill="#1c1f26" stroke="#d4922a" stroke-width="2"/><text x="79" y="1576.5" text-anchor="middle" font-size="16" font-weight="700" fill="#e8e9ec">11</text><text x="147" y="1536" font-size="11.6" fill="#d4922a" font-weight="700" letter-spacing="1">PARAM FUZZ</text><text x="147" y="1569" fill="#e8e9ec" font-size="20" font-weight="650">Fuzz request parameters</text><text x="147" y="1603" fill="#aeb5c1" font-size="14.6">Parameter names were tested on the identified endpoint</text></g><g><rect x="122" y="1647" width="608" height="116" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="122" y="1662" width="4" height="86" rx="2" fill="#d4922a"/><circle cx="79" cy="1705" r="20" fill="#1c1f26" stroke="#d4922a" stroke-width="2"/><text x