<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="380" height="3008" viewBox="0 0 380 3008" role="img" aria-labelledby="ha-title ha-desc">
<title id="ha-title">HA-01 root privilege-escalation chain — thirteen original steps</title>
<desc id="ha-desc">SSH as devops, privilege enumeration, cron maintenance, root backup script, wildcard tar option injection using checkpoint action filenames, root cron execution of root-flag.sh, copying /root/root.txt to /opt/maint/spool/root.txt, root flag retrieval and submission; no interactive root shell was preserved.</desc>
<rect x="8" y="8" width="364" height="2992" rx="18" fill="#1c1f26" stroke="#3a3f4a"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif"><text x="25" y="43" font-size="13" font-weight="700" fill="#d4922a">HA-01 / ROOT ESCALATION</text><text x="25" y="82" font-size="25" font-weight="700" fill="#e8e9ec">Cron and tar → root</text><text x="25" y="110" font-size="13" fill="#9aa0ad">13 stages · Complete technical chain</text><path d="M25 130 H355" stroke="#3a3f4a"/><path d="M34 268.5 V443.5" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" fill="none" stroke-linecap="round"/><path d="M34 481.5 V656.5" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" fill="none" stroke-linecap="round"/><path d="M34 694.5 V869.5" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" fill="none" stroke-linecap="round"/><path d="M34 907.5 V1082.5" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" fill="none" stroke-linecap="round"/><path d="M34 1120.5 V1295.5" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" fill="none" stroke-linecap="round"/><path d="M34 1333.5 V1508.5" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" fill="none" stroke-linecap="round"/><path d="M34 1546.5 V1721.5" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" fill="none" stroke-linecap="round"/><path d="M34 1759.5 V1934.5" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" fill="none" stroke-linecap="round"/><path d="M34 1972.5 V2147.5" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" fill="none" stroke-linecap="round"/><path d="M34 2185.5 V2360.5" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" fill="none" stroke-linecap="round"/><path d="M34 2398.5 V2573.5" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" fill="none" stroke-linecap="round"/><path d="M34 2611.5 V2786.5" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" fill="none" stroke-linecap="round"/><g><rect x="60" y="152" width="300" height="195" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="168" width="4" height="163" rx="2" fill="#4fb3bf"/><circle cx="34" cy="249.5" r="16" stroke="#4fb3bf" stroke-width="2" fill="#1c1f26"/><text x="34" y="254.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8e9ec">01</text><text x="76" y="177" font-size="10" font-weight="700" fill="#4fb3bf" letter-spacing="1">EXISTING FOOTHOLD</text><text x="76" y="224" font-size="17.2" font-weight="650" fill="#e8e9ec">SSH access as devops</text><text x="76" y="290" font-size="12.7" fill="#aeb5c1">Redis RDB persistence yielded SSH</text><text x="76" y="310" font-size="12.7" fill="#aeb5c1">access as devops</text></g><g><rect x="60" y="365" width="300" height="195" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="381" width="4" height="163" rx="2" fill="#d4922a"/><circle cx="34" cy="462.5" r="16" stroke="#d4922a" stroke-width="2" fill="#1c1f26"/><text x="34" y="467.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8e9ec">02</text><text x="76" y="390" font-size="10" font-weight="700" fill="#d4922a" letter-spacing="1">LOCAL ENUMERATION</text><text x="76" y="426" font-size="16" font-weight="650" fill="#e8e9ec">Enumerate local</text><text x="76" y="448" font-size="16" font-weight="650" fill="#e8e9ec">privilege-escalation paths</text><text x="76" y="503" font-size="12.7" fill="#aeb5c1">sudo unavailable; standard SUID; no</text><text x="76" y="523" font-size="12.7" fill="#aeb5c1">getcap entries</text></g><g><rect x="60" y="578" width="300" height="195" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="594" width="4" height="163" rx="2" fill="#d4922a"/><circle cx="34" cy="675.5" r="16" stroke="#d4922a" stroke-width="2" fill="#1c1f26"/><text x="34" y="680.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8e9ec">03</text><text x="76" y="603" font-size="10" font-weight="700" fill="#d4922a" letter-spacing="1">CRON DISCOVERY</text><text x="76" y="650" font-size="17.2" font-weight="650" fill="#e8e9ec">Discover /etc/cron.d/maint</text><text x="76" y="716" font-size="12.7" fill="#aeb5c1">Inspect /etc/cron.d and identify the</text><text x="76" y="736" font-size="12.7" fill="#aeb5c1">maint cron task</text></g><g><rect x="60" y="791" width="300" height="195" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="807" width="4" height="163" rx="2" fill="#d4922a"/><circle cx="34" cy="888.5" r="16" stroke="#d4922a" stroke-width="2" fill="#1c1f26"/><text x="34" y="893.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8e9ec">04</text><text x="76" y="816" font-size="10" font-weight="700" fill="#d4922a" letter-spacing="1">ROOT SCHEDULE</text><text x="76" y="852" font-size="16" font-weight="650" fill="#e8e9ec">Identify root cron job</text><text x="76" y="874" font-size="16" font-weight="650" fill="#e8e9ec">running every minute</text><text x="76" y="929" font-size="12.7" fill="#aeb5c1">* * * * * root /opt/maint/backup.sh</text><text x="76" y="949" font-size="12.7" fill="#aeb5c1">redirects output</text></g><g><rect x="60" y="1004" width="300" height="195" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="1020" width="4" height="163" rx="2" fill="#d4922a"/><circle cx="34" cy="1101.5" r="16" stroke="#d4922a" stroke-width="2" fill="#1c1f26"/><text x="34" y="1106.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8e9ec">05</text><text x="76" y="1029" font-size="10" font-weight="700" fill="#d4922a" letter-spacing="1">SCRIPT ANALYSIS</text><text x="76" y="1076" font-size="17.2" font-weight="650" fill="#e8e9ec">Inspect /opt/maint/backup.sh</text><text x="76" y="1142" font-size="12.7" fill="#aeb5c1">Root-owned backup runs tar -czf</text><text x="76" y="1162" font-size="12.7" fill="#aeb5c1">/opt/maint/backup.tar.gz *</text></g><g><rect x="60" y="1217" width="300" height="195" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="1233" width="4" height="163" rx="2" fill="#d4922a"/><circle cx="34" cy="1314.5" r="16" stroke="#d4922a" stroke-width="2" fill="#1c1f26"/><text x="34" y="1319.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8e9ec">06</text><text x="76" y="1242" font-size="10" font-weight="700" fill="#d4922a" letter-spacing="1">WILDCARD INJECTION</text><text x="76" y="1278" font-size="16" font-weight="650" fill="#e8e9ec">Identify tar wildcard</text><text x="76" y="1300" font-size="16" font-weight="650" fill="#e8e9ec">expansion</text><text x="76" y="1355" font-size="12.7" fill="#aeb5c1">Unquoted * becomes filenames parsed by</text><text x="76" y="1375" font-size="12.7" fill="#aeb5c1">GNU tar as options</text></g><g><rect x="60" y="1430" width="300" height="195" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="1446" width="4" height="163" rx="2" fill="#d4922a"/><circle cx="34" cy="1527.5" r="16" stroke="#d4922a" stroke-width="2" fill="#1c1f26"/><text x="34" y="1532.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8e9ec">07</text><text x="76" y="1455" font-size="10" font-weight="700" fill="#d4922a" letter-spacing="1">PERMISSION BOUNDARY</text><text x="76" y="1491" font-size="16" font-weight="650" fill="#e8e9ec">Discover devops-writable</text><text x="76" y="1513" font-size="16" font-weight="650" fill="#e8e9ec">/opt/maint/spool</text><text x="76" y="1568" font-size="12.7" fill="#aeb5c1">Spool owner devops:devops; write test</text><text x="76" y="1588" font-size="12.7" fill="#aeb5c1">returned WRITABLE</text></g><g><rect x="60" y="1643" width="300" height="195" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="1659" width="4" height="163" rx="2" fill="#d4922a"/><circle cx="34" cy="1740.5" r="16" stroke="#d4922a" stroke-width="2" fill="#1c1f26"/><text x="34" y="1745.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8e9ec">08</text><text x="76" y="1668" font-size="10" font-weight="700" fill="#d4922a" letter-spacing="1">PAYLOAD PREPARATION</text><text x="76" y="1715" font-size="17.2" font-weight="650" fill="#e8e9ec">Create root-flag.sh</text><text x="76" y="1781" font-size="12.7" fill="#aeb5c1">Use printf; copy flag into spool and</text><text x="76" y="1801" font-size="12.7" fill="#aeb5c1">chmod resulting file 644</text></g><g><rect x="60" y="1856" width="300" height="195" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="1872" width="4" height="163" rx="2" fill="#d4922a"/><circle cx="34" cy="1953.5" r="16" stroke="#d4922a" stroke-width="2" fill="#1c1f26"/><text x="34" y="1958.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8e9ec">09</text><text x="76" y="1881" font-size="10" font-weight="700" fill="#d4922a" letter-spacing="1">OPTION INJECTION</text><text x="76" y="1917" font-size="16" font-weight="650" fill="#e8e9ec">Create malicious</text><text x="76" y="1939" font-size="16" font-weight="650" fill="#e8e9ec">--checkpoint filenames</text><text x="76" y="1994" font-size="12.7" fill="#aeb5c1">Make --checkpoint=1 and</text><text x="76" y="2014" font-size="12.7" fill="#aeb5c1">--checkpoint-action=exec=sh</text><text x="76" y="2034" font-size="12.7" fill="#aeb5c1">root-flag.sh</text></g><g><rect x="60" y="2069" width="300" height="195" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="2085" width="4" height="163" rx="2" fill="#4fae6c"/><circle cx="34" cy="2166.5" r="16" stroke="#4fae6c" stroke-width="2" fill="#1c1f26"/><text x="34" y="2171.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8e9ec">10</text><text x="76" y="2094" font-size="10" font-weight="700" fill="#4fae6c" letter-spacing="1">ROOT EXECUTION</text><text x="76" y="2130" font-size="16" font-weight="650" fill="#e8e9ec">Root cron executes tar with</text><text x="76" y="2152" font-size="16" font-weight="650" fill="#e8e9ec">injected options</text><text x="76" y="2207" font-size="12.7" fill="#aeb5c1">Each minute root tar triggers sh</text><text x="76" y="2227" font-size="12.7" fill="#aeb5c1">root-flag.sh via checkpoint</text></g><g><rect x="60" y="2282" width="300" height="195" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="2298" width="4" height="163" rx="2" fill="#4fae6c"/><circle cx="34" cy="2379.5" r="16" stroke="#4fae6c" stroke-width="2" fill="#1c1f26"/><text x="34" y="2384.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8e9ec">11</text><text x="76" y="2307" font-size="10" font-weight="700" fill="#4fae6c" letter-spacing="1">FLAG COPY</text><text x="76" y="2343" font-size="16" font-weight="650" fill="#e8e9ec">/root/root.txt copied to</text><text x="76" y="2365" font-size="16" font-weight="650" fill="#e8e9ec">spool directory</text><text x="76" y="2420" font-size="12.7" fill="#aeb5c1">root-flag.sh creates</text><text x="76" y="2440" font-size="12.7" fill="#aeb5c1">/opt/maint/spool/root.txt</text></g><g><rect x="60" y="2495" width="300" height="195" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="2511" width="4" height="163" rx="2" fill="#4fae6c"/><circle cx="34" cy="2592.5" r="16" stroke="#4fae6c" stroke-width="2" fill="#1c1f26"/><text x="34" y="2597.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8e9ec">12</text><text x="76" y="2520" font-size="10" font-weight="700" fill="#4fae6c" letter-spacing="1">FLAG RETRIEVAL</text><text x="76" y="2556" font-size="16" font-weight="650" fill="#e8e9ec">Read</text><text x="76" y="2578" font-size="16" font-weight="650" fill="#e8e9ec">/opt/maint/spool/root.txt</text><text x="76" y="2633" font-size="12.7" fill="#aeb5c1">devops reads the root flag file after</text><text x="76" y="2653" font-size="12.7" fill="#aeb5c1">chmod 644</text></g><g><rect x="60" y="2708" width="300" height="195" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="2724" width="4" height="163" rx="2" fill="#4fae6c"/><circle cx="34" cy="2805.5" r="16" stroke="#4fae6c" stroke-width="2" fill="#1c1f26"/><text x="34" y="2810.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8e9ec">13</text><text x="76" y="2733" font-size="10" font-weight="700" fill="#4fae6c" letter-spacing="1">OBJECTIVE COMPLETE</text><text x="76" y="2780" font-size="17.2" font-weight="650" fill="#e8e9ec">ROOT FLAG RETRIEVED</text><text x="76" y="2846" font-size="12.7" fill="#aeb5c1">Flag obtained and submitted; no</text><text x="76" y="2866" font-size="12.7" fill="#aeb5c1">interactive root shell proven</text></g><text x="25" y="2937" font-size="11.3" fill="#8b93a1">Root cron executed the injected shell script</text><text x="25" y="2962" font-size="11.3" fill="#8b93a1">No interactive root shell documented</text></g></svg>