<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 2955" width="380" height="2955" role="img" aria-labelledby="me-chain-title me-chain-desc">
<title id="me-chain-title">ME-01 complete attack chain — seventeen original stages</title>
<desc id="me-chain-desc">IT GATE File Service, download API, path traversal and arbitrary file read, svc account and source code, config.py and API key disclosure, authenticated ping endpoint, command injection, RCE as svc, capability enumeration, pyadmin cap_setuid=ep, os.setuid(0), captured effective and real UID 0, root flag retrieval and submission. User flag was read through file traversal. Root execution was inside the application container; no host escape was proven.</desc>
