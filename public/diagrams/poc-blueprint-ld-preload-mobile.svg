<title id="poc-title">LD_PRELOAD — exploitation blueprint</title>
<desc id="poc-description">Technical diagram of the original PoC stages: web (UID 1000) → sudo -l → Create malicious C source → Compile with GCC → Generate shared library (.so) → sudo LD_PRELOAD=/tmp/in01_preload.so \
/usr/local/bin/healthcheck → Shared-library constructor executes → UID = 0, EUID = 0 → Read /root/root.txt. NOPASSWD: /usr/local/bin/healthcheck; env_keep += LD_PRELOAD. .</desc>
