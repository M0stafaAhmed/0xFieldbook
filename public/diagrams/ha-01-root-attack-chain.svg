<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="2422" viewBox="0 0 760 2422" role="img" aria-labelledby="ha-title ha-desc">
<title id="ha-title">HA-01 root privilege-escalation chain — thirteen original steps</title>
<desc id="ha-desc">SSH as devops, privilege enumeration, cron maintenance, root backup script, wildcard tar option injection using checkpoint action filenames, root cron execution of root-flag.sh, copying /root/root.txt to /opt/maint/spool/root.txt, root flag retrieval and submission; no interactive root shell was preserved.</desc>
<rect x="8" y="8" width="744" height="2406" rx="18" fill="#1c1f26" stroke="#3a3f4a"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif"><text x="39" y="49" font-size="14" font-weight="700" fill="#d4922a" letter-spacing="2.1">HA-01 / ROOT ESCALATION</text><text x="39" y="96" font-size="33" font-weight="700" fill="#e8e9ec">Complete privilege-escalation chain</text><text x="39" y="130" font-size="17" fill="#9aa0ad">All 13 stages · Cron execution and GNU tar wildcard injection</text><path d="M35 153 H725" stroke="#3a3f4a"/><path d="M79 271 V391" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" fill="none" stroke-linecap="round"/><path d="M79 437 V557" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" fill="none" stroke-linecap="round"/><path d="M79 603 V723" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" fill="none" stroke-linecap="round"/><path d="M79 769 V889" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" fill="none" stroke-linecap="round"/><path d="M79 935 V1055" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" fill="none" stroke-linecap="round"/><path d="M79 1101 V1221" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" fill="none" stroke-linecap="round"/><path d="M79 1267 V1387" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" fill="none" stroke-linecap="round"/><path d="M79 1433 V1553" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" fill="none" stroke-linecap="round"/><path d="M79 1599 V1719" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" fill="none" stroke-linecap="round"/><path d="M79 1765 V1885" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" fill="none" stroke-linecap="round"/><path d="M79 1931 V2051" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" fill="none" stroke-linecap="round"/><path d="M79 2097 V2217" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5" fill="none" stroke-linecap="round"/><g><rect x="122" y="174" width="608" height="148" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="122" y="190" width="4" height="116" rx="2" fill="#4fb3bf"/><circle cx="79" cy="248" r="20" stroke="#4fb3bf" stroke-width="2" fill="#1c1f26"/><text x="79" y="253.5" text-anchor="middle" font-size="16" font-weight="700" fill="#e8e9ec">01</text><text x="147" y="199" font-size="11.6" font-weight="700" fill="#4fb3bf" letter-spacing="1">EXISTING FOOTHOLD</text><text x="147" y="238" font-size="20" font-weight="650" fill="#e8e9ec">SSH access as devops</text><text x="147" y="285" font-size="15" fill="#aeb5c1">Redis RDB persistence yielded SSH access as devops</text></g><g><rect x="122" y="340" width="608" height="148" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="122" y="356" width="4" height="116" rx="2" fill="#d4922a"/><circle cx="79" cy="414" r="20" stroke="#d4922a" stroke-width="2" fill="#1c1f26"/><text x="79" y="419.5" text-anchor="middle" font-size="16" font-weight="700" fill="#e8e9ec">02</text><text x="147" y="365" font-size="11.6" font-weight="700" fill="#d4922a" letter-spacing="1">LOCAL ENUMERATION</text><text x="147" y="404" font-size="20" font-weight="650" fill="#e8e9ec">Enumerate local privilege-escalation paths</text><text x="147" y="451" font-size="15" fill="#aeb5c1">sudo unavailable; standard SUID; no getcap entries</text></g><g><rect x="122" y="506" width="608" height="148" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="122" y="522" width="4" height="116" rx="2" fill="#d4922a"/><circle cx="79" cy="580" r="20" stroke="#d4922a" stroke-width="2" fill="#1c1f26"/><text x="79" y="585.5" text-anchor="middle" font-size="16" font-weight="700" fill="#e8e9ec">03</text><text x="147" y="531" font-size="11.6" font-weight="700" fill="#d4922a" letter-spacing="1">CRON DISCOVERY</text><text x="147" y="570" font-size="20" font-weight="650" fill="#e8e9ec">Discover /etc/cron.d/maint</text><text x="147" y="617" font-size="15" fill="#aeb5c1">Inspect /etc/cron.d and identify the maint cron task</text></g><g><rect x="122" y="672" width="608" height="148" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="122" y="688" width="4" height="116" rx="2" fill="#d4922a"/><circle cx="79" cy="746" r="20" stroke="#d4922a" stroke-width="2" fill="#1c1f26"/><text x="79" y="751.5" text-anchor="middle" font-size="16" font-weight="700" fill="#e8e9ec">04</text><text x="147" y="697" font-size="11.6" font-weight="700" fill="#d4922a" letter-spacing="1">ROOT SCHEDULE</text><text x="147" y="736" font-size="20" font-weight="650" fill="#e8e9ec">Identify root cron job running every minute</text><text x="147" y="783" font-size="15" fill="#aeb5c1">* * * * * root /opt/maint/backup.sh redirects output</text></g><g><rect x="122" y="838" width="608" height="148" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="122" y="854" width="4" height="116" rx="2" fill="#d4922a"/><circle cx="79" cy="912" r="20" stroke="#d4922a" stroke-width="2" fill="#1c1f26"/><text x="79" y="917.5" text-anchor="middle" font-size="16" font-weight="700" fill="#e8e9ec">05</text><text x="147" y="863" font-size="11.6" font-weight="700" fill="#d4922a" letter-spacing="1">SCRIPT ANALYSIS</text><text x="147" y="902" font-size="20" font-weight="650" fill="#e8e9ec">Inspect /opt/maint/backup.sh</text><text x="147" y="949" font-size="15" fill="#aeb5c1">Root-owned backup runs tar -czf /opt/maint/backup.tar.gz *</text></g><g><rect x="122" y="1004" width="608" height="148" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="122" y="1020" width="4" height="116" rx="2" fill="#d4922a"/><circle cx="79" cy="1078" r="20" stroke="#d4922a" stroke-width="2" fill="#1c1f26"/><text x="79" y="1083.5" text-anchor="middle" font-size="16" font-weight="700" fill="#e8e9ec">06</text><text x="147" y="1029" font-size="11.6" font-weight="700" fill="#d4922a" letter-spacing="1">WILDCARD INJECTION</text><text x="147" y="1068" font-size="20" font-weight="650" fill="#e8e9ec">Identify tar wildcard expansion</text><text x="147" y="1115" font-size="15" fill="#aeb5c1">Unquoted * becomes filenames parsed by GNU tar as options</text></g><g><rect x="122" y="1170" width="608" height="148" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="122" y="1186" width="4" height="116" rx="2" fill="#d4922a"/><circle cx="79" cy="1244" r="20" stroke="#d4922a" stroke-width="2" fill="#1c1f26"/><text x="79" y="1249.5" text-anchor="middle" font-size="16" font-weight="700" fill="#e8e9ec">07</text><text x="147" y="1195" font-size="11.6" font-weight="700" fill="#d4922a" letter-spacing="1">PERMISSION BOUNDARY</text><text x="147" y="1234" font-size="20" font-weight="650" fill="#e8e9ec">Discover devops-writable /opt/maint/spool</text><text x="147" y="1281" font-size="15" fill="#aeb5c1">Spool owner devops:devops; write test returned WRITABLE</text></g><g><rect x="122" y="1336" width="608" height="148" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="122" y="1352" width="4" height="116" rx="2" fill="#d4922a"/><circle cx="79" cy="1410" r="20" stroke="#d4922a" stroke-width="2" fill="#1c1f26"/><text x="79" y="1415.5" text-anchor="middle" font-size="16" font-weight="700" fill="#e8e9ec">08</text><text x="147" y="1361" font-size="11.6" font-weight="700" fill="#d4922a" letter-spacing="1">PAYLOAD PREPARATION</text><text x="147" y="1400" font-size="20" font-weight="650" fill="#e8e9ec">Create root-flag.sh</text><text x="147" y="1447" font-size="15" fill="#aeb5c1">Use printf; copy flag into spool and chmod resulting file 644</text></g><g><rect x="122" y="1502" width="608" height="148" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="122" y="1518" width="4" height="116" rx="2" fill="#d4922a"/><circle cx="79" cy="1576" r="20" stroke="#d4922a" stroke-width="2" fill="#1c1f26"/><text x="79" y="1581.5" text-anchor="middle" font-size="16" font-weight="700" fill="#e8e9ec">09</text><text x="147" y="1527" font-size="11.6" font-weight="700" fill="#d4922a" letter-spacing="1">OPTION INJECTION</text><text x="147" y="1566" font-size="20" font-weight="650" fill="#e8e9ec">Create malicious --checkpoint filenames</text><text x="147" y="1613" font-size="15" fill="#aeb5c1">Make --checkpoint=1 and --checkpoint-action=exec=sh root-flag.sh</text></g><g><rect x="122" y="1668" width="608" height="148" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="122" y="1684" width="4" height="116" rx="2" fill="#4fae6c"/><circle cx="79" cy="1742" r="20" stroke="#4fae6c" stroke-width="2" fill="#1c1f26"/><text x="79" y="1747.5" text-anchor="middle" font-size="16" font-weight="700" fill="#e8e9ec">10</text><text x="147" y="1693" font-size="11.6" font-weight="700" fill="#4fae6c" letter-spacing="1">ROOT EXECUTION</text><text x="147" y="1732" font-size="20" font-weight="650" fill="#e8e9ec">Root cron executes tar with injected options</text><text x="147" y="1779" font-size="15" fill="#aeb5c1">Each minute root tar triggers sh root-flag.sh via checkpoint</text></g><g><rect x="122" y="1834" width="608" height="148" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="122" y="1850" width="4" height="116" rx="2" fill="#4fae6c"/><circle cx="79" cy="1908" r="20" stroke="#4fae6c" stroke-width="2" fill="#1c1f26"/><text x="79" y="1913.5" text-anchor="middle" font-size="16" font-weight="700" fill="#e8e9ec">11</text><text x="147" y="1859" font-size="11.6" font-weight="700" fill="#4fae6c" letter-spacing="1">FLAG COPY</text><text x="147" y="1898" font-size="20" font-weight="650" fill="#e8e9ec">/root/root.txt copied to spool directory</text><text x="147" y="1945" font-size="15" fill="#aeb5c1">root-flag.sh creates /opt/maint/spool/root.txt</text></g><g><rect x="122" y="2000" width="608" height="148" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="122" y="2016" width="4" height="116" rx="2" fill="#4fae6c"/><circle cx="79" cy="2074" r="20" stroke="#4fae6c" stroke-width="2" fill="#1c1f26"/><text x="79" y="2079.5" text-anchor="middle" font-size="16" font-weight="700" fill="#e8e9ec">12</text><text x="147" y="2025" font-size="11.6" font-weight="700" fill="#4fae6c" letter-spacing="1">FLAG RETRIEVAL</text><text x="147" y="2064" font-size="20" font-weight="650" fill="#e8e9ec">Read /opt/maint/spool/root.txt</text><text x="147" y="2111" font-size="15" fill="#aeb5c1">devops reads the root flag file after chmod 644</text></g><g><rect x="122" y="2166" width="608" height="148" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="122" y="2182" width="4" height="116" rx="2" fill="#4fae6c"/><circle cx="79" cy="2240" r="20" stroke="#4fae6c" stroke-width="2" fill="#1c1f26"/><text x="79" y="2245.5" text-anchor="middle" font-size="16" font-weight="700" fill="#e8e9ec">13</text><text x="147" y="2191" font-size="11.6" font-weight="700" fill="#4fae6c" letter-spacing="1">OBJECTIVE COMPLETE</text><text x="147" y="2230" font-size="20" font-weight="650" fill="#e8e9ec">ROOT FLAG RETRIEVED</text><text x="147" y="2277" font-size="15" fill="#aeb5c1">Flag obtained and submitted; no interactive root shell proven</text></g><text x="39" y="2347" font-size="14" fill="#8b93a1">Root cron executed the injected script; root flag copied into a devops-readable spool</text><text x="39" y="2373" font-size="14" fill="#8b93a1">Flag submitted (participant-confirmed); no separate interactive root shell evidenced</text></g></svg>