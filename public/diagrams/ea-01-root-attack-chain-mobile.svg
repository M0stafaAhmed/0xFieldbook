<title id="ea-root-title">EA-01 complete privilege escalation — thirteen documented stages</title>
<desc id="ea-root-description">SSH access as robert, identity and groups, attempted sudo enumeration, sudo not installed, SUID enumeration, discovery of root-owned SUID /usr/bin/find, exploitation through find -exec and /bin/sh -p, expected effective UID 0 with unretained raw output, root flag reading, flag submission, and EA-01 completion. This is SUID exploitation, not a sudo misconfiguration.</desc>
