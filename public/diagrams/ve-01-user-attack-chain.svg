    <text x="146" y="829" font-size="21" font-weight="650" fill="#e8e9ec">Enumerate /home</text>
    <text x="146" y="856" fill="#aeb5c1" font-size="15.8">Run ls -la /home through the PHP endpoint</text>
  </g>
<g>
    <rect x="122" y="897" width="608" height="101" rx="12" fill="#242832" stroke="#3a3f4a" />
    <rect x="122" y="912" width="4" height="71" rx="2" fill="#d4922a" />
    <circle cx="79" cy="947.5" r="20" stroke="#d4922a" stroke-width="2" fill="#1c1f26" />
    <text x="79" y="953" text-anchor="middle" fill="#e8e9ec" font-size="16" font-weight="700">07</text>
