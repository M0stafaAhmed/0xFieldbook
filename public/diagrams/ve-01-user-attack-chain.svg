    <text x="146" y="950" font-size="21" font-weight="650" fill="#e8e9ec">Identify /home/user</text>
    <text x="146" y="977" fill="#aeb5c1" font-size="15.8">Find the user directory; traversal is permitted</text>
  </g>
<g>
    <rect x="122" y="1018" width="608" height="101" rx="12" fill="#242832" stroke="#3a3f4a" />
    <rect x="122" y="1033" width="4" height="71" rx="2" fill="#4fae6c" />
    <circle cx="79" cy="1068.5" r="20" stroke="#4fae6c" stroke-width="2" fill="#1c1f26" />
    <text x="79" y="1074" text-anchor="middle" fill="#e8e9ec" font-size="16" font-weight="700">08</text>
    <text x="146" y="1041" font-size="11.8" font-weight="700" letter-spacing="1.2" fill="#4fae6c">FLAG RETRIEVAL</text>
    <text x="146" y="1071" font-size="21" font-weight="650" fill="#e8e9ec">Read /home/user/user.txt</text>
    <text x="146" y="1098" fill="#aeb5c1" font-size="15.8">Run cat /home/user/user.txt to retrieve the flag</text>
  </g>
