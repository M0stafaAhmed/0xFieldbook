 <text x="39" y="96" fill="#e8e9ec" font-size="34" font-weight="700">Initial access to user flag</text>
 <text x="39" y="128" fill="#9aa0ad" font-size="17">Ten documented steps, from the web application to submission</text>
 <line x1="35" y1="149" x2="725" y2="149" stroke="#3a3f4a"/>
