<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1445" width="760" height="1445" role="img" aria-labelledby="ve-user-title ve-user-description">
  <title id="ve-user-title">VE-01 user-level attack chain — 10 documented steps</title>
  <desc id="ve-user-description">HTTP application, file upload vulnerability, PHP command execution, command endpoint /uploads/file.php?cmd=, web server account www-data, home directory enumeration, discovery of /home/user, reading /home/user/user.txt, submitting user flag, and participant-confirmed user-level objective completion.</desc>
  <rect x="8" y="8" width="744" height="1429" rx="18" fill="#1c1f26" stroke="#3a3f4a"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
