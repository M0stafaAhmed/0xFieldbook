    <text x="146" y="678" font-size="11.8" font-weight="700" letter-spacing="1.2" fill="#d4922a">ACCESS CONTEXT</text>
    <text x="146" y="708" font-size="21" font-weight="650" fill="#e8e9ec">Execution as www-data</text>
    <text x="146" y="735" fill="#aeb5c1" font-size="15.8">Commands run under the web-server account</text>
  </g>
<g>
    <rect x="122" y="776" width="608" height="101" rx="12" fill="#242832" stroke="#3a3f4a" />
    <rect x="122" y="791" width="4" height="71" rx="2" fill="#d4922a" />
