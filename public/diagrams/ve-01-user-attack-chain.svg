    <text x="146" y="436" font-size="11.8" font-weight="700" letter-spacing="1.2" fill="#4fb3bf">EXECUTION</text>
    <text x="146" y="466" font-size="21" font-weight="650" fill="#e8e9ec">PHP Command Execution</text>
    <text x="146" y="493" fill="#aeb5c1" font-size="15.8">Uploaded PHP is interpreted and executes OS commands</text>
  </g>
<g>
    <rect x="122" y="534" width="608" height="101" rx="12" fill="#242832" stroke="#3a3f4a" />
    <rect x="122" y="549" width="4" height="71" rx="2" fill="#4fb3bf" />
    <circle cx="79" cy="584.5" r="20" stroke="#4fb3bf" stroke-width="2" fill="#1c1f26" />
    <text x="79" y="590" text-anchor="middle" fill="#e8e9ec" font-size="16" font-weight="700">04</text>
    <text x="146" y="557" font-size="11.8" font-weight="700" letter-spacing="1.2" fill="#4fb3bf">COMMAND ENDPOINT</text>
    <text x="146" y="587" font-size="21" font-weight="650" fill="#e8e9ec">/uploads/file.php?cmd=</text>
    <text x="146" y="614" fill="#aeb5c1" font-size="15.8">Use the cmd parameter; pwd confirms execution</text>
  </g>
<g>
    <rect x="122" y="655" width="608" height="101" rx="12" fill="#242832" stroke="#3a3f4a" />
    <rect x="122" y="670" width="4" height="71" rx="2" fill="#d4922a" />
    <circle cx="79" cy="705.5" r="20" stroke="#d4922a" stroke-width="2" fill="#1c1f26" />
