    <circle cx="79" cy="221.5" r="20" stroke="#4fb3bf" stroke-width="2" fill="#1c1f26" />
    <text x="79" y="227" text-anchor="middle" fill="#e8e9ec" font-size="16" font-weight="700">01</text>
    <text x="146" y="194" font-size="11.8" font-weight="700" letter-spacing="1.2" fill="#4fb3bf">ENTRY POINT</text>
    <text x="146" y="224" font-size="21" font-weight="650" fill="#e8e9ec">HTTP Application</text>
    <text x="146" y="251" fill="#aeb5c1" font-size="15.8">Reach the assigned web service</text>
  </g>
<g>
    <rect x="122" y="292" width="608" height="101" rx="12" fill="#242832" stroke="#3a3f4a" />
    <rect x="122" y="307" width="4" height="71" rx="2" fill="#4fb3bf" />
    <circle cx="79" cy="342.5" r="20" stroke="#4fb3bf" stroke-width="2" fill="#1c1f26" />
    <text x="79" y="348" text-anchor="middle" fill="#e8e9ec" font-size="16" font-weight="700">02</text>
    <text x="146" y="315" font-size="11.8" font-weight="700" letter-spacing="1.2" fill="#4fb3bf">INITIAL ACCESS</text>
    <text x="146" y="345" font-size="21" font-weight="650" fill="#e8e9ec">File Upload Vulnerability</text>
    <text x="146" y="372" fill="#aeb5c1" font-size="15.8">Identify the application&apos;s vulnerable upload surface</text>
  </g>
<g>
    <rect x="122" y="413" width="608" height="101" rx="12" fill="#242832" stroke="#3a3f4a" />
    <rect x="122" y="428" width="4" height="71" rx="2" fill="#4fb3bf" />
