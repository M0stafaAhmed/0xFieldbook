e="#4b5565" stroke-width="2" stroke-dasharray="4 5"/><path d="M34 3101.5 V3233.5" fill="none" stroke="#4b5565" stroke-width="2" stroke-dasharray="4 5"/><g><rect x="60" y="152" width="300" height="151" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="167" width="4" height="121" rx="2" fill="#4fb3bf"/><circle cx="34" cy="227.5" r="16" fill="#1c1f26" stroke="#4fb3bf" stroke-width="2"/><text x="34" y="232.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8e9ec">01</text><text x="77" y="175" font-size="9.9" fill="#4fb3bf" font-weight="700" letter-spacing="1">RECON</text><text x="77" y="201" fill="#e8e9ec" font-size="16.1" font-weight="650">Enumerate assigned HTTP and SSH</text><text x="77" y="222" fill="#e8e9ec" font-size="16.1" font-weight="650">services</text><text x="77" y="262" fill="#aeb5c1" font-size="12.5">Nmap identified external OpenSSH and</text><text x="77" y="281" fill="#aeb5c1" font-size="12.5">Gunicorn HTTP service</text></g><g><rect x="60" y="320" width="300" height="151" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="335" width="4" height="121" rx="2" fill="#4fb3bf"/><circle cx="34" cy="395.5" r="16" fill="#1c1f26" stroke="#4fb3bf" stroke-width="2"/><text x="34" y="400.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8e9ec">02</text><text x="77" y="343" font-size="9.9" fill="#4fb3bf" font-weight="700" letter-spacing="1">FINGERPRINT</text><text x="77" y="369" fill="#e8e9ec" font-size="16.1" font-weight="650">Fingerprint public Gunicorn</text><text x="77" y="390" fill="#e8e9ec" font-size="16.1" font-weight="650">application</text><text x="77" y="430" fill="#aeb5c1" font-size="12.5">HTTP headers and WhatWeb fingerprinted</text><text x="77" y="449" fill="#aeb5c1" font-size="12.5">the URL-preview app</text></g><g><rect x="60" y="488" width="300" height="151" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="503" width="4" height="121" rx="2" fill="#4fb3bf"/><circle cx="34" cy="563.5" r="16" fill="#1c1f26" stroke="#4fb3bf" stroke-width="2"/><text x="34" y="568.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8e9ec">03</text><text x="77" y="511" font-size="9.9" fill="#4fb3bf" font-weight="700" letter-spacing="1">FETCH SURFACE</text><text x="77" y="537" fill="#e8e9ec" font-size="16.1" font-weight="650">Confirm server-side fetching</text><text x="77" y="558" fill="#e8e9ec" font-size="16.1" font-weight="650">through /fetch</text><text x="77" y="598" fill="#aeb5c1" font-size="12.5">/fetch?url= retrieves remote content</text><text x="77" y="617" fill="#aeb5c1" font-size="12.5">using the server</text></g><g><rect x="60" y="656" width="300" height="151" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="671" width="4" height="121" rx="2" fill="#4fb3bf"/><circle cx="34" cy="731.5" r="16" fill="#1c1f26" stroke="#4fb3bf" stroke-width="2"/><text x="34" y="736.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8e9ec">04</text><text x="77" y="679" font-size="9.9" fill="#4fb3bf" font-weight="700" letter-spacing="1">FILTER TEST</text><text x="77" y="705" fill="#e8e9ec" font-size="16.1" font-weight="650">Test canonical loopback</text><text x="77" y="726" fill="#e8e9ec" font-size="16.1" font-weight="650">addresses</text><text x="77" y="766" fill="#aeb5c1" font-size="12.5">localhost and 127.0.0.1 blocked with</text><text x="77" y="785" fill="#aeb5c1" font-size="12.5">403 responses</text></g><g><rect x="60" y="824" width="300" height="151" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="839" width="4" height="121" rx="2" fill="#4fb3bf"/><circle cx="34" cy="899.5" r="16" fill="#1c1f26" stroke="#4fb3bf" stroke-width="2"/><text x="34" y="904.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8e9ec">05</text><text x="77" y="847" font-size="9.9" fill="#4fb3bf" font-weight="700" letter-spacing="1">BYPASS FINDING</text><text x="77" y="873" fill="#e8e9ec" font-size="16.1" font-weight="650">Identify alternative loopback</text><text x="77" y="894" fill="#e8e9ec" font-size="16.1" font-weight="650">representations</text><text x="77" y="934" fill="#aeb5c1" font-size="12.5">Numeric loopback forms such as 127.1</text><text x="77" y="953" fill="#aeb5c1" font-size="12.5">bypassed filter logic</text></g><g><rect x="60" y="992" width="300" height="151" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="1007" width="4" height="121" rx="2" fill="#4fb3bf"/><circle cx="34" cy="1067.5" r="16" fill="#1c1f26" stroke="#4fb3bf" stroke-width="2"/><text x="34" y="1072.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8e9ec">06</text><text x="77" y="1015" font-size="9.9" fill="#4fb3bf" font-weight="700" letter-spacing="1">CONTROL PROOF</text><text x="77" y="1041" fill="#e8e9ec" font-size="16.1" font-weight="650">Confirm 127.1 reaches internal</text><text x="77" y="1062" fill="#e8e9ec" font-size="16.1" font-weight="650">connection stage</text><text x="77" y="1102" fill="#aeb5c1" font-size="12.5">502 refusal on unused port 80 showed a</text><text x="77" y="1121" fill="#aeb5c1" font-size="12.5">connection attempt</text></g><g><rect x="60" y="1160" width="300" height="151" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="1175" width="4" height="121" rx="2" fill="#4fb3bf"/><circle cx="34" cy="1235.5" r="16" fill="#1c1f26" stroke="#4fb3bf" stroke-width="2"/><text x="34" y="1240.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8e9ec">07</text><text x="77" y="1183" font-size="9.9" fill="#4fb3bf" font-weight="700" letter-spacing="1">INTERNAL ENUM</text><text x="77" y="1209" fill="#e8e9ec" font-size="16.1" font-weight="650">Discover internal services</text><text x="77" y="1230" fill="#e8e9ec" font-size="16.1" font-weight="650">through port enumeration</text><text x="77" y="1270" fill="#aeb5c1" font-size="12.5">FFUF probed ports through the</text><text x="77" y="1289" fill="#aeb5c1" font-size="12.5">server-side fetch path</text></g><g><rect x="60" y="1328" width="300" height="151" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="1343" width="4" height="121" rx="2" fill="#4fb3bf"/><circle cx="34" cy="1403.5" r="16" fill="#1c1f26" stroke="#4fb3bf" stroke-width="2"/><text x="34" y="1408.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8e9ec">08</text><text x="77" y="1351" font-size="9.9" fill="#4fb3bf" font-weight="700" letter-spacing="1">ADMIN API</text><text x="77" y="1377" fill="#e8e9ec" font-size="16.1" font-weight="650">Identify internal Admin API on</text><text x="77" y="1398" fill="#e8e9ec" font-size="16.1" font-weight="650">port 9000</text><text x="77" y="1438" fill="#aeb5c1" font-size="12.5">127.1:9000 exposed the localhost-only</text><text x="77" y="1457" fill="#aeb5c1" font-size="12.5">Admin API</text></g><g><rect x="60" y="1496" width="300" height="151" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="1511" width="4" height="121" rx="2" fill="#d4922a"/><circle cx="34" cy="1571.5" r="16" fill="#1c1f26" stroke="#d4922a" stroke-width="2"/><text x="34" y="1576.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8e9ec">09</text><text x="77" y="1519" font-size="9.9" fill="#d4922a" font-weight="700" letter-spacing="1">ROUTE FUZZ</text><text x="77" y="1555" fill="#e8e9ec" font-size="17.5" font-weight="650">Fuzz API routes</text><text x="77" y="1606" fill="#aeb5c1" font-size="12.5">API wordlists and negative controls</text><text x="77" y="1625" fill="#aeb5c1" font-size="12.5">distinguished responses</text></g><g><rect x="60" y="1664" width="300" height="151" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="1679" width="4" height="121" rx="2" fill="#d4922a"/><circle cx="34" cy="1739.5" r="16" fill="#1c1f26" stroke="#d4922a" stroke-width="2"/><text x="34" y="1744.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8e9ec">10</text><text x="77" y="1687" font-size="9.9" fill="#d4922a" font-weight="700" letter-spacing="1">ROUTE FOUND</text><text x="77" y="1723" fill="#e8e9ec" font-size="17.5" font-weight="650">Discover /admin/exec</text><text x="77" y="1774" fill="#aeb5c1" font-size="12.5">The internal API exposed its execution</text><text x="77" y="1793" fill="#aeb5c1" font-size="12.5">endpoint</text></g><g><rect x="60" y="1832" width="300" height="151" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="1847" width="4" height="121" rx="2" fill="#d4922a"/><circle cx="34" cy="1907.5" r="16" fill="#1c1f26" stroke="#d4922a" stroke-width="2"/><text x="34" y="1912.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8e9ec">11</text><text x="77" y="1855" font-size="9.9" fill="#d4922a" font-weight="700" letter-spacing="1">PARAM FUZZ</text><text x="77" y="1891" fill="#e8e9ec" font-size="17.5" font-weight="650">Fuzz request parameters</text><text x="77" y="1942" fill="#aeb5c1" font-size="12.5">Parameter names were tested on the</text><text x="77" y="1961" fill="#aeb5c1" font-size="12.5">identified endpoint</text></g><g><rect x="60" y="2000" width="300" height="151" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="2015" width="4" height="121" rx="2" fill="#d4922a"/><circle cx="34" cy="2075.5" r="16" fill="#1c1f26" stroke="#d4922a" stroke-width="2"/><text x="34" y="2080.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8e9ec">12</text><text x="77" y="2023" font-size="9.9" fill="#d4922a" font-weight="700" letter-spacing="1">PARAM FOUND</text><text x="77" y="2059" fill="#e8e9ec" font-size="17.5" font-weight="650">Identify data parameter</text><text x="77" y="2110" fill="#aeb5c1" font-size="12.5">The data input produced</text><text x="77" y="2129" fill="#aeb5c1" font-size="12.5">Base64-processing errors</text></g><g><rect x="60" y="2168" width="300" height="151" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="2183" width="4" height="121" rx="2" fill="#d4922a"/><circle cx="34" cy="2243.5" r="16" fill="#1c1f26" stroke="#d4922a" stroke-width="2"/><text x="34" y="2248.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8e9ec">13</text><text x="77" y="2191" font-size="9.9" fill="#d4922a" font-weight="700" letter-spacing="1">DESERIALIZATION</text><text x="77" y="2217" fill="#e8e9ec" font-size="16.1" font-weight="650">Identify Base64 decoding and</text><text x="77" y="2238" fill="#e8e9ec" font-size="16.1" font-weight="650">Pickle deserialization</text><text x="77" y="2278" fill="#aeb5c1" font-size="12.5">Controlled errors exposed the unsafe</text><text x="77" y="2297" fill="#aeb5c1" font-size="12.5">decoding pipeline</text></g><g><rect x="60" y="2336" width="300" height="151" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="2351" width="4" height="121" rx="2" fill="#d4922a"/><circle cx="34" cy="2411.5" r="16" fill="#1c1f26" stroke="#d4922a" stroke-width="2"/><text x="34" y="2416.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8e9ec">14</text><text x="77" y="2359" font-size="9.9" fill="#d4922a" font-weight="700" letter-spacing="1">PICKLE PAYLOAD</text><text x="77" y="2395" fill="#e8e9ec" font-size="17.5" font-weight="650">Craft malicious Pickle object</text><text x="77" y="2446" fill="#aeb5c1" font-size="12.5">Python __reduce__ payload invoked a</text><text x="77" y="2465" fill="#aeb5c1" font-size="12.5">subprocess command</text></g><g><rect x="60" y="2504" width="300" height="151" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="2519" width="4" height="121" rx="2" fill="#4fae6c"/><circle cx="34" cy="2579.5" r="16" fill="#1c1f26" stroke="#4fae6c" stroke-width="2"/><text x="34" y="2584.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8e9ec">15</text><text x="77" y="2527" font-size="9.9" fill="#4fae6c" font-weight="700" letter-spacing="1">RCE PROVEN</text><text x="77" y="2553" fill="#e8e9ec" font-size="16.1" font-weight="650">Confirm command execution as</text><text x="77" y="2574" fill="#e8e9ec" font-size="16.1" font-weight="650">web</text><text x="77" y="2614" fill="#aeb5c1" font-size="12.5">Captured id returned uid=1000(web);</text><text x="77" y="2633" fill="#aeb5c1" font-size="12.5">cwd /opt/app</text></g><g><rect x="60" y="2672" width="300" height="151" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="2687" width="4" height="121" rx="2" fill="#d4922a"/><circle cx="34" cy="2747.5" r="16" fill="#1c1f26" stroke="#d4922a" stroke-width="2"/><text x="34" y="2752.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8e9ec">16</text><text x="77" y="2695" font-size="9.9" fill="#d4922a" font-weight="700" letter-spacing="1">CALLBACK TEST</text><text x="77" y="2731" fill="#e8e9ec" font-size="17.5" font-weight="650">Attempt reverse shell</text><text x="77" y="2782" fill="#aeb5c1" font-size="12.5">Bash callbacks attempted over VPN</text><text x="77" y="2801" fill="#aeb5c1" font-size="12.5">interfaces</text></g><g><rect x="60" y="2840" width="300" height="151" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="2855" width="4" height="121" rx="2" fill="#c9a85a"/><circle cx="34" cy="2915.5" r="16" fill="#1c1f26" stroke="#c9a85a" stroke-width="2"/><text x="34" y="2920.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8e9ec">17</text><text x="77" y="2863" font-size="9.9" fill="#c9a85a" font-weight="700" letter-spacing="1">NEGATIVE RESULT</text><text x="77" y="2899" fill="#e8e9ec" font-size="17.5" font-weight="650">Callback unsuccessful</text><text x="77" y="2950" fill="#aeb5c1" font-size="12.5">Neither listener received a shell;</text><text x="77" y="2969" fill="#aeb5c1" font-size="12.5">reason unverified</text></g><g><rect x="60" y="3008" width="300" height="151" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="3023" width="4" height="121" rx="2" fill="#4fae6c"/><circle cx="34" cy="3083.5" r="16" fill="#1c1f26" stroke="#4fae6c" stroke-width="2"/><text x="34" y="3088.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8e9ec">18</text><text x="77" y="3031" font-size="9.9" fill="#4fae6c" font-weight="700" letter-spacing="1">IN-BAND RCE</text><text x="77" y="3057" fill="#e8e9ec" font-size="16.1" font-weight="650">Continue using in-band command</text><text x="77" y="3078" fill="#e8e9ec" font-size="16.1" font-weight="650">execution</text><text x="77" y="3118" fill="#aeb5c1" font-size="12.5">ssrf_exec returned command output in</text><text x="77" y="3137" fill="#aeb5c1" font-size="12.5">HTTP responses</text></g><g><rect x="60" y="3176" width="300" height="151" rx="12" fill="#242832" stroke="#3a3f4a"/><rect x="60" y="3191" width="4" height="121" rx="2" fill="#4fae6c"/><circle cx="34" cy="3251.5" r="16" fill="#1c1f26" stroke="#4fae6c" stroke-width="2"/><text x="34" y="3256.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8e9ec">19</text><text x="77" y="3199" font-size="9.9" fill="#4fae6c" font-weight="700" letter-spacing="1">USER OBJECTIVE</text><text x="77" y="3225" fill="#e8e9ec" font-size="16.1" font-weight="650">Issue user.txt retrieval</text><text x="77" y="3246" fill="#e8e9ec" font-size="16.1" font-weight="650">command</text><text x="77" y="3286" fill="#aeb5c1" font-size="12.5">cat /home/$(whoami)/user.txt; flag</text><text x="77" y="3305" fill="#aeb5c1" font-size="12.5">participant-confirmed</text></g><text x="25" y="3354" font-size="11.2" fill="#8b93a1">Reverse-shell callbacks unsuccessful</text><text x="25" y="3376" font-size="11.2" fill="#8b93a1">Cause unverified; in-band RCE remained</text><text x="25" y="3398" font-size="11.2" fill="#8b93a1">User flag participant-confirmed</text></g></svg>