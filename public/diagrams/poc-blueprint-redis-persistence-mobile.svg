<title id="poc-title">REDIS PERSISTENCE — exploitation blueprint</title>
<desc id="poc-description">Technical diagram of the original PoC stages: Unauthenticated Redis → Redis administrative access → Identify an existing Linux account → Locate its .ssh directory → Confirm Redis can write there → Generate SSH key pair locally → Configure Redis persistence → Store newline-padded public key → SAVE -&gt; authorized_keys → SSH authentication → Linux user access. . .</desc>
