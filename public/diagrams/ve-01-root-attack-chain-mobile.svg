<text x="78" y="700" font-size="17.2" font-weight="650" fill="#e8e9ec">/usr/bin/find</text>
    <text x="78" y="732" font-size="12.7" fill="#aeb5c1">www-data may run find as root</text>
  <text x="78" y="752" font-size="12.7" fill="#aeb5c1">No password required</text>
