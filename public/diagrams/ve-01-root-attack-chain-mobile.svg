    <text x="78" y="1006" font-size="18" font-weight="650" fill="#e8e9ec">Execute find through sudo</text>
    <text x="78" y="1050" font-size="12.7" fill="#aeb5c1">Run sudo /usr/bin/find with -exec</text>
  <text x="78" y="1070" font-size="12.7" fill="#aeb5c1">Recorded payload also uses -quit</text>
