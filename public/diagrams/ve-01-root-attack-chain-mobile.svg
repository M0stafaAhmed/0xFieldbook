    <text x="78" y="211" font-size="18" font-weight="650" fill="#e8e9ec">PHP Command Execution</text>
    <text x="78" y="255" font-size="12.7" fill="#aeb5c1">OS commands via uploaded PHP</text>
  <text x="78" y="275" font-size="12.7" fill="#aeb5c1">Existing command-execution channel</text>
  </g>
