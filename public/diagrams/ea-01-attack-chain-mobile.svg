<title id="ea-title">EA-01 full attack chain — 17 steps from SQL injection to root</title>
<desc id="ea-desc">Seventeen-step documented chain: HTTP search SQL injection, UNION, SQLite and sqlite_master enumeration, users table, credential extraction, SSH authentication as robert, user flag, SUID enumeration and GNU find -exec privilege escalation, expected effective UID 0, and root flag. EA-01 exploits SUID find, not sudo; root privilege verification raw output was not retained.</desc>
